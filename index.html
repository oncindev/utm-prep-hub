<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="UT Prep Hub" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230284c7'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
  <title>UT Prep Hub Ultimate — Sains Data UT Bandung (Sem 3)</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #1e293b;
      --card: #1e293b;
      --card-2: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-bg: rgba(56, 189, 248, 0.14);
      --accent: #a78bfa;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    html.light {
      --bg: #f8fafc;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-bg: rgba(2, 132, 199, 0.1);
      --accent: #7c3aed;
      --success: #059669;
      --success-bg: rgba(5, 150, 105, 0.1);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.1);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      font-size: 15px;
      padding-bottom: 86px;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .header-top {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand h1 { margin: 0; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em; }
    .brand p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .pill-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--warning-bg);
      color: var(--warning);
      white-space: nowrap;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .icon-btn.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }

    .container { max-width: 960px; margin: 0 auto; padding: 12px 14px; }

    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .bnav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .bnav-btn span.b-ico { font-size: 17px; line-height: 1; }
    .bnav-btn.active { color: var(--primary); background: var(--primary-bg); }
    @media (max-width: 768px) {
      .mode-tabs { display: none; }
      .bottom-nav { display: grid; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .overview-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .progress-bar-wrap {
      width: 100%;
      height: 7px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 9px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.25s ease;
    }
    .readiness-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .check-chip {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .check-chip.done { border-color: var(--success); background: var(--success-bg); color: var(--success); }

    /* Sub-pills */
    .sub-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

    /* Accordion */
    .acc-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .acc-head {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }
    .acc-body { padding: 0 14px 14px; border-top: 1px solid var(--border); display: none; font-size: 14px; }
    .acc-item.open .acc-body { display: block; }
    .acc-item.open .acc-chevron { transform: rotate(180deg); }
    .acc-chevron { transition: transform 0.2s ease; color: var(--muted); }
    .acc-body ul { padding-left: 18px; margin: 10px 0 0; }
    .acc-body li { margin-bottom: 6px; }
    .tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-bg);
      color: var(--primary);
      margin-right: 6px;
    }
    .tag-danger { background: var(--danger-bg); color: var(--danger); }
    .cheat-table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--card-2); font-weight: 700; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .cheat-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; }
    .cheat-box h3 { margin: 0 0 8px; font-size: 13.5px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .cheat-box ul { margin: 0; padding-left: 17px; font-size: 13px; }
    .cheat-box li { margin-bottom: 5px; }

    code {
      background: var(--card-2);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* Flashcard */
    .fc-controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .fc-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      min-height: 230px;
      padding: 26px 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      position: relative;
      touch-action: pan-y;
      user-select: none;
    }
    .fc-card.flipped { border-color: var(--primary); background: var(--card-2); }
    .fc-top-right { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
    .fc-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary); margin-bottom: 10px; }
    .fc-text { font-size: 16.5px; font-weight: 600; max-width: 640px; }
    .fc-card.flipped .fc-text { font-size: 15px; font-weight: 500; }
    .fc-hint { font-size: 11.5px; color: var(--muted); margin-top: 14px; }
    .sm2-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #082f49; border-color: transparent; }
    html.light .btn-primary { color: #ffffff; }
    .btn-success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
    .btn-warn { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

    /* Quiz */
    .quiz-toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .q-num { font-size: 12px; font-weight: 700; color: var(--primary); }
    .q-text { font-size: 15.5px; font-weight: 600; margin: 8px 0 14px; }
    .opt-list { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .opt-btn.correct { background: var(--success-bg); border-color: var(--success); }
    .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); }
    .opt-key { font-weight: 800; min-width: 22px; color: var(--primary); }
    .explain-box {
      margin-top: 13px;
      padding: 12px;
      border-radius: 12px;
      background: var(--primary-bg);
      border-left: 4px solid var(--primary);
      font-size: 13.5px;
    }
    .quiz-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
    .score-banner { text-align: center; padding: 18px 14px; }
    .score-big { font-size: 42px; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .input-field, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }
    .lab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
    .stat-box { background: var(--card-2); border-radius: 12px; padding: 10px; text-align: center; }
    .stat-val { font-size: 20px; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 11px; color: var(--muted); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-panel {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 560px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-head h2 { margin: 0; font-size: 16px; }

    /* Print A4 */
    @media print {
      .header, .mode-tabs, .bottom-nav, .quiz-toolbar, .sub-pills, .icon-btn, .btn, .search-input, .readiness-row { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; padding: 0; font-size: 11.5pt; }
      .card, .acc-item, .cheat-box { box-shadow: none !important; border: 1px solid #cbd5e1 !important; background: #ffffff !important; break-inside: avoid; }
      .acc-body { display: block !important; }
    }
    /* New UX & Lifecycle Styles */
    .hero-card {
      background: linear-gradient(135deg, rgba(56,189,248,0.16), rgba(167,139,250,0.16));
      border: 1px solid rgba(56,189,248,0.35);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .sec-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    .subj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(265px, 1fr)); gap: 10px; }
    .subj-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .subj-card:hover, .subj-card:active { border-color: var(--primary); transform: translateY(-1px); }
    .lc-dots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 2px; }
    .lc-pill {
      font-size: 10.5px;
      font-weight: 700;
      text-align: center;
      padding: 4px 2px;
      border-radius: 8px;
      background: var(--card-2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .lc-pill.done { background: var(--success-bg); color: var(--success); border-color: rgba(52,211,153,0.4); }

    /* 4-Step Lifecycle Stepper */
    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      background: var(--card);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .step-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 4px;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11.5px;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .step-btn .st-num {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--card-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }
    .step-btn.done .st-num { background: var(--success-bg); color: var(--success); }
    .step-btn.active { background: var(--primary-bg); color: var(--primary); }
    .step-btn.active .st-num { background: var(--primary); color: #082f49; }
    html.light .step-btn.active .st-num { color: #ffffff; }

    /* Segmented Control */
    .seg-ctrl {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 12px;
      max-width: 100%;
      overflow-x: auto;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .seg-btn.active { background: var(--card-2); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }

    /* Next Step CTA */
    .next-cta {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--primary);
      border-radius: 16px;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .q-dots { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; margin-bottom: 8px; }
    .q-dots::-webkit-scrollbar { display: none; }
    .q-dot {
      flex: 0 0 auto; min-width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card-2); color: var(--muted);
      font-size: 11.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .q-dot.cur { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
    .q-dot.ok { border-color: var(--success); color: var(--success); background: var(--success-bg); }
    .q-dot.bad { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
    @media (max-width: 768px) {
      .stepper { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div style="display:flex;align-items:center;gap:9px;">
        <button class="icon-btn" id="backHomeBtn" style="display:none;" onclick="goHome()">← Beranda</button>
        <div class="brand">
          <h1 id="headerTitle">UT Prep Hub</h1>
          <p id="headerSub">Sains Data UT Bandung • Sem 3</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="pill-badge" id="countdownBadge">H-3 UTM</span>
        <button class="icon-btn" onclick="openModal('searchModal')" title="Cari Lintas Matkul">🔍</button>
        <button class="icon-btn" onclick="openModal('toolsModal')" title="Menu &amp; Alat Belajar">☰ <span id="pomoMini" style="display:none;font-family:ui-monospace,monospace;">25:00</span></button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="stepperWrap"></div>
    <div id="contentArea"></div>
  </main>

  <nav class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="bnav-btn active" data-mode="summary"><span class="b-ico">📖</span><span>1. Pahami</span></button>
    <button class="bnav-btn" data-mode="cheatsheet"><span class="b-ico">⚡</span><span>2. Kuasai</span></button>
    <button class="bnav-btn" data-mode="flashcard"><span class="b-ico">🃏</span><span>3. Hafal</span></button>
    <button class="bnav-btn" data-mode="quiz"><span class="b-ico">📝</span><span>4. Uji</span></button>
  </nav>

  <div class="toast" id="toastEl"></div>

  <!-- Global Search Modal -->
  <div class="modal-backdrop" id="searchModal" onclick="if(event.target===this) closeModal('searchModal')">
    <div class="modal-panel">
      <div class="modal-head">
        <h2>🔍 Pencarian Lintas 6 Matkul</h2>
        <button class="icon-btn" onclick="closeModal('searchModal')">✕</button>
      </div>
      <input class="input-field" id="globalSearchInput" type="search" placeholder="Ketik istilah (misal: Bayes, Spark, MongoDB, PPKI, RMSE)..." oninput="renderGlobalSearch(this.value)" />
      <div id="globalSearchResults" style="margin-top:12px;"></div>
    </div>
  </div>

  <!-- Menu & Tools Drawer Modal -->
  <div class="modal-backdrop" id="toolsModal" onclick="if(event.target===this) closeModal('toolsModal')">
    <div class="modal-panel">
      <div class="modal-head">
        <h2>☰ Menu &amp; Alat Belajar</h2>
        <button class="icon-btn" onclick="closeModal('toolsModal')">✕</button>
      </div>

      <div class="cheat-box" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <div><b>🍅 Pomodoro Fokus</b><div id="pomoPhaseLbl" style="font-size:11.5px;color:var(--muted);">25:00 • Sesi Fokus</div></div>
        <div style="display:flex;gap:6px;align-items:center;">
          <span id="pomoBigTime" style="font-weight:800;font-family:ui-monospace,monospace;font-size:16px;margin-right:4px;">25:00</span>
          <button class="btn btn-primary" style="padding:7px 11px;" id="pomoStartBtn" onclick="togglePomodoro()">▶</button>
          <button class="icon-btn" onclick="resetPomodoro(25)">25m</button>
          <button class="icon-btn" onclick="resetPomodoro(5)">5m</button>
        </div>
      </div>

      <div class="cheat-box" style="margin-bottom:10px;">
        <h3>📈 Kalkulator Nilai Akhir UT (Tuton 30% + UAS 70%)</h3>
        <div class="lab-grid">

      localStorage.setItem("ut_learned", JSON.stringify(state.learned));

      localStorage.setItem("ut_readiness", JSON.stringify(state.readiness));

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toastEl");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    const initTheme = () => {
      if (localStorage.getItem("ut_theme") === "light") document.documentElement.classList.add("light");
      document.getElementById("themeBtn").onclick = () => {
        document.documentElement.classList.toggle("light");
        const isLight = document.documentElement.classList.contains("light");
        localStorage.setItem("ut_theme", isLight ? "light" : "dark");
        showToast(isLight ? "☀️ Tema Terang aktif" : "🌙 Tema Gelap aktif");
      };
    };

    const isMixedUTM = () => state.subjectIdx === "mixed_utm";
    const currentSubject = () => (typeof state.subjectIdx === "number") ? DATA[state.subjectIdx] : null;

    function getSubjectStats(s) {
      const readDone = !!state.readiness[`${s.id}_read`];
      const formulaDone = !!state.readiness[`${s.id}_formula`];
      const totalFC = s.flashcards.length;
      const learnedCount = s.flashcards.filter((_, idx) => state.learned[`${s.id}_${idx}`]).length;
      const fcDone = learnedCount >= Math.ceil(totalFC * 0.8);
      const qCorrect = s.quiz.filter((q, idx) => isQCorrect(q, state.quizAnswers[`${s.id}_${idx}`])).length;
      const qAns = s.quiz.filter((_, idx) => state.quizAnswers[`${s.id}_${idx}`] !== undefined).length;
      const qPct = Math.round((qCorrect / s.quiz.length) * 100);
      const quizDone = qCorrect >= Math.ceil(s.quiz.length * 0.8);
      const stepsDone = [readDone, formulaDone, fcDone, quizDone].filter(Boolean).length;
      return { readDone, formulaDone, fcDone, quizDone, learnedCount, totalFC, qCorrect, qAns, qPct, stepsDone };
    }

    function updateHeader() {
      const backBtn = document.getElementById("backHomeBtn");
      const title = document.getElementById("headerTitle");
      const sub = document.getElementById("headerSub");
      const badge = document.getElementById("countdownBadge");
      const now = new Date();

      if (state.view === "home") {
        backBtn.style.display = "none";
        title.textContent = "UT Prep Hub";
        sub.textContent = "Sains Data UT Bandung • Sem 3";
        const diff = Math.ceil((new Date("2026-11-28T00:00:00+07:00") - now) / 86400000);
        badge.textContent = diff > 0 ? `H-${diff} UTM` : "UTM Berjalan";
      } else {
        backBtn.style.display = "inline-block";
        if (state.cramMode) {
          title.textContent = "⚡ Cramming 5 Menit";
          sub.textContent = "Soal Salah & Ditandai ⭐";
          badge.textContent = "Mode Kilat";
        } else if (isMixedUTM()) {
          title.textContent = "🎯 Simulasi UTM";
          sub.textContent = "Campuran 4 Matkul (28–29 Nov)";
          badge.textContent = "20 Soal Acak";
        } else {
          const s = currentSubject();
          title.textContent = `${s.icon} ${s.short}`;
          sub.textContent = `${s.code} • ${s.name}`;
          let targetStr = "2026-11-28T00:00:00+07:00", label = "UTM";
          if (s.exam.includes("29 Nov")) targetStr = "2026-11-29T00:00:00+07:00";
          else if (s.exam.includes("12 Des")) { targetStr = "2026-12-12T00:00:00+07:00"; label = "UO"; }
          const diff = Math.ceil((new Date(targetStr) - now) / 86400000);
          badge.textContent = diff > 0 ? `H-${diff} ${label}` : `Hari-H ${label}`;
        }
      }
    }

      const utmList = DATA.slice(0, 4);
      const uoList = DATA.slice(4);
      const utmReady = utmList.reduce((acc, s) => acc + getSubjectStats(s).stepsDone, 0);

      const utmPct = Math.round((utmReady / utmTotalSteps) * 100);

      const lastIdx = typeof state.subjectIdx === "number" ? state.subjectIdx : 0;
      const lastSubj = DATA[lastIdx];
      const stepMap = { summary: 1, cheatsheet: 2, flashcard: 3, quiz: 4 };
      const lastStepNum = stepMap[state.mode] || 1;

      const renderCard = (s, i) => {
        const st = getSubjectStats(s);
        return `

              <div>
                <div style="font-size:15px;font-weight:800;">${s.icon} ${s.name}</div>
                <div style="font-size:11.5px;color:var(--muted);">${s.code} • ${s.exam}</div>

            </div>
            <div class="lc-dots">
              <div class="lc-pill ${st.readDone?'done':''}">${st.readDone?'✓':'1.'} Materi</div>
              <div class="lc-pill ${st.formulaDone?'done':''}">${st.formulaDone?'✓':'2.'} Rumus</div>
              <div class="lc-pill ${st.fcDone?'done':''}">${st.fcDone?'✓':'3.'} Kartu</div>
              <div class="lc-pill ${st.quizDone?'done':''}">${st.quizDone?'✓':'4.'} Uji</div>
            </div>
          </div>
        `;
      };

    function erfApprox(z) {
      const t = 1 / (1 + 0.3275911 * Math.abs(z));
      const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429;
      const y = 1 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-z * z);
      return z >= 0 ? y : -y;
    }
    function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

    function renderMiniLab() {
      const s = currentSubject();
      const cm = state.cm;
      const tot = (cm.tp + cm.fp + cm.fn + cm.tn) || 1;
      const acc = (((cm.tp + cm.tn) / tot) * 100).toFixed(1);
      const prec = (cm.tp + cm.fp) ? ((cm.tp / (cm.tp + cm.fp)) * 100).toFixed(1) : "0.0";
      const rec = (cm.tp + cm.fn) ? ((cm.tp / (cm.tp + cm.fn)) * 100).toFixed(1) : "0.0";
      const pNum = parseFloat(prec), rNum = parseFloat(rec);
      const f1 = (pNum + rNum) ? ((2 * pNum * rNum) / (pNum + rNum)).toFixed(1) : "0.0";

      const st = state.statLab;
      let statOut = "";
      if (st.type === "binom") {
        const n = Math.max(1, Math.min(20, +st.n || 10)), k = Math.max(0, Math.min(n, +st.k || 0)), p = Math.max(0, Math.min(1, +st.p || 0));
        const prob = (fact(n) / (fact(k) * fact(n - k))) * Math.pow(p, k) * Math.pow(1 - p, n - k);
        statOut = `P(X = ${k}) = <b>${prob.toFixed(5)}</b> • E[X] = <b>${(n * p).toFixed(2)}</b> • Var(X) = <b>${(n * p * (1 - p)).toFixed(3)}</b>`;
      } else if (st.type === "poisson") {
        const lam = Math.max(0.01, +st.lam || 1), k = Math.max(0, Math.min(20, +st.k || 0));
        const prob = (Math.pow(lam, k) * Math.exp(-lam)) / fact(k);
        statOut = `P(X = ${k}) = <b>${prob.toFixed(5)}</b> • E[X] = Var(X) = <b>${lam}</b>`;
      } else if (st.type === "exp") {
        const lam = Math.max(0.01, +st.lam || 1), x = Math.max(0, +st.x || 0);
        const cdf = 1 - Math.exp(-lam * x);
        statOut = `P(X ≤ ${x}) = <b>${cdf.toFixed(5)}</b> • P(X > ${x}) = <b>${(1 - cdf).toFixed(5)}</b> • E[X] = <b>${(1 / lam).toFixed(3)}</b>`;
      } else {
        const mu = +st.mu || 0, sd = Math.max(0.01, +st.sd || 1), x = +st.x || 0;
        const z = (x - mu) / sd;
        const cdf = 0.5 * (1 + erfApprox(z / Math.SQRT2));
        statOut = `Z = <b>${z.toFixed(3)}</b> • P(X ≤ ${x}) = <b>${cdf.toFixed(5)}</b>`;
      }

      const showCM = s && ["datamining", "bigdata", "ai"].includes(s.id);
      const showStat = s && ["statmat", "datamining"].includes(s.id);
      return `
        ${showCM ? `
          <div class="card">
            <h3 style="margin:0 0 6px;font-size:14px;color:var(--primary);">🧮 Confusion Matrix Playground</h3>
            <div class="lab-grid">
              <div><label style="font-size:11px;">TP</label><input class="input-field" type="number" min="0" value="${cm.tp}" oninput="updateCM('tp', this.value)" /></div>
              <div><label style="font-size:11px;">FP</label><input class="input-field" type="number" min="0" value="${cm.fp}" oninput="updateCM('fp', this.value)" /></div>
              <div><label style="font-size:11px;">FN</label><input class="input-field" type="number" min="0" value="${cm.fn}" oninput="updateCM('fn', this.value)" /></div>
              <div><label style="font-size:11px;">TN</label><input class="input-field" type="number" min="0" value="${cm.tn}" oninput="updateCM('tn', this.value)" /></div>
            </div>
            <div class="lab-grid">
              <div class="stat-box"><div class="stat-val">${acc}%</div><div class="stat-lbl">Accuracy</div></div>
              <div class="stat-box"><div class="stat-val">${prec}%</div><div class="stat-lbl">Precision</div></div>
              <div class="stat-box"><div class="stat-val">${rec}%</div><div class="stat-lbl">Recall</div></div>
              <div class="stat-box"><div class="stat-val">${f1}%</div><div class="stat-lbl">F1-Score</div></div>
            </div>
          </div>
        ` : ""}
        ${showStat ? `
        <div class="card">
          <h3 style="margin:0 0 8px;font-size:14px;color:var(--primary);">📐 Kalkulator Distribusi Statmat</h3>
          <div class="seg-ctrl">
            <button class="seg-btn ${st.type==='binom'?'active':''}" onclick="setStatLabType('binom')">Binomial</button>
            <button class="seg-btn ${st.type==='poisson'?'active':''}" onclick="setStatLabType('poisson')">Poisson</button>
            <button class="seg-btn ${st.type==='exp'?'active':''}" onclick="setStatLabType('exp')">Eksponensial</button>
            <button class="seg-btn ${st.type==='norm'?'active':''}" onclick="setStatLabType('norm')">Normal</button>
          </div>
          <div class="lab-grid">
            ${st.type==='binom' ? `
              <div><label style="font-size:11px;">n</label><input class="input-field" type="number" min="1" max="20" value="${st.n}" oninput="updateStatLab('n',this.value)" /></div>
              <div><label style="font-size:11px;">p</label><input class="input-field" type="number" step="0.05" min="0" max="1" value="${st.p}" oninput="updateStatLab('p',this.value)" /></div>
              <div><label style="font-size:11px;">k</label><input class="input-field" type="number" min="0" max="20" value="${st.k}" oninput="updateStatLab('k',this.value)" /></div>
            ` : st.type==='poisson' ? `
              <div><label style="font-size:11px;">λ</label><input class="input-field" type="number" step="0.1" min="0.1" value="${st.lam}" oninput="updateStatLab('lam',this.value)" /></div>
              <div><label style="font-size:11px;">k</label><input class="input-field" type="number" min="0" max="20" value="${st.k}" oninput="updateStatLab('k',this.value)" /></div>
            ` : st.type==='exp' ? `
              <div><label style="font-size:11px;">λ</label><input class="input-field" type="number" step="0.1" min="0.05" value="${st.lam}" oninput="updateStatLab('lam',this.value)" /></div>
              <div><label style="font-size:11px;">x</label><input class="input-field" type="number" step="0.1" min="0" value="${st.x}" oninput="updateStatLab('x',this.value)" /></div>
            ` : `
              <div><label style="font-size:11px;">μ</label><input class="input-field" type="number" step="0.5" value="${st.mu}" oninput="updateStatLab('mu',this.value)" /></div>
              <div><label style="font-size:11px;">σ</label><input class="input-field" type="number" step="0.1" min="0.1" value="${st.sd}" oninput="updateStatLab('sd',this.value)" /></div>
              <div><label style="font-size:11px;">x</label><input class="input-field" type="number" step="0.1" value="${st.x}" oninput="updateStatLab('x',this.value)" /></div>
            `}
          </div>
          <div class="explain-box" style="margin-top:8px;">${statOut}</div>
        </div>
        ` : ""}
      `;
    }

    function getDeck() {

      if (state.fcFilter === "starred") {
        const res = items.filter(c => state.starredFC[`${s.id}_${c.origIdx}`]);
        return res.length ? res : items;
      }
      return items;
    }

    function shuffleArr(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function isQCorrect(q, ans) {
      if (ans === undefined) return false;
      const t = q.type || "pg";
      if (t === "pg") return ans === q.ans;
      return ans === true;
    }

    function buildQuizSession() {
      let pool = [];
      if (state.cramMode) {
        DATA.forEach(s => {
          s.quiz.forEach((q, idx) => {
            const k = `${s.id}_${idx}`;
            const a = state.quizAnswers[k];
            if (state.starredQ[k] || (a !== undefined && !isQCorrect(q, a))) pool.push({ subjId: s.id, subjShort: s.short, qIdx: idx, origQ: q });
          });
        });
        if (!pool.length) DATA.slice(0, 4).forEach(s => s.quiz.slice(0, 3).forEach((q, idx) => pool.push({ subjId: s.id, subjShort: s.short, qIdx: idx, origQ: q })));
        pool = shuffleArr(pool).slice(0, 15);
      } else if (isMixedUTM()) {
        DATA.slice(0, 4).forEach(s => s.quiz.forEach((q, idx) => pool.push({ subjId: s.id, subjShort: s.short, qIdx: idx, origQ: q })));
        pool = shuffleArr(pool).slice(0, 20);
      } else {
        const s = currentSubject();
        pool = s.quiz.map((q, idx) => ({ subjId: s.id, subjShort: s.short, qIdx: idx, origQ: q }));
      }
      if (state.onlyStarredQuiz && !state.cramMode) {
        const starred = pool.filter(item => state.starredQ[`${item.subjId}_${item.qIdx}`]);
        if (starred.length) pool = starred;
      }
      if (state.shuffleQuiz && !isMixedUTM() && !state.cramMode) pool = shuffleArr(pool);
      state.quizSession = pool.map(item => {
        const q = item.origQ;
        const t = q.type || "pg";
        if (t === "pg") {
          const optsWithFlag = q.opts.map((text, idx) => ({ text, isAns: idx === q.ans, origIdx: idx }));
          const finalOpts = (state.shuffleQuiz || isMixedUTM() || state.cramMode) ? shuffleArr(optsWithFlag) : optsWithFlag;
          return { ...item, displayOpts: finalOpts };
        }
        if (t === "match") {
          return { ...item, rightShuffled: shuffleArr(q.pairs.map(p => p[1])) };
        }
        if (t === "order") {
          return { ...item, orderShuffled: shuffleArr(q.items) };
        }
        return { ...item };
      });
      const firstUnanswered = state.quizSession.findIndex(item => state.quizAnswers[`${item.subjId}_${item.qIdx}`] === undefined);
      state.quizIdx = firstUnanswered >= 0 ? firstUnanswered : 0;
      state.quizFinished = false;
    }

    function formatTimer(sec) { return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; }

    function renderQuiz() {
      const curS = currentSubject();
      const essayFilled = curS ? curS.essays.filter((_, i) => (state.essayDrafts[`${curS.id}_es_${i}`] || "").trim().length > 0).length : 0;
      const subModeBar = !isMixedUTM() && !state.cramMode ? `
        <div class="seg-ctrl" style="margin:0;">
          <button class="seg-btn ${state.subModeQuiz==='pg'?'active':''}" onclick="state.subModeQuiz='pg'; render();">📝 Kuis Variasi (${curS ? curS.quiz.length : 26})</button>
          <button class="seg-btn ${state.subModeQuiz==='essay'?'active':''}" onclick="state.subModeQuiz='essay'; render();">✍️ Studi Kasus (${essayFilled}/${curS.essays.length})</button>
        </div>
      ` : "<div></div>";
      if (state.subModeQuiz === "essay" && !isMixedUTM() && !state.cramMode) return `<div style="margin-bottom:12px;">${subModeBar}</div>` + renderEssays();
      if (!state.quizSession) buildQuizSession();
      const session = state.quizSession;
      const answeredCount = session.filter(it => state.quizAnswers[`${it.subjId}_${it.qIdx}`] !== undefined).length;

      const toolbar = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
          ${subModeBar}
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button class="icon-btn ${state.shuffleQuiz ? "active" : ""}" onclick="toggleShuffleQuiz()">🔀 Acak</button>
            <button class="icon-btn ${state.onlyStarredQuiz ? "active" : ""}" onclick="toggleStarredQuiz()">⭐</button>
            <button class="icon-btn ${state.timerActive ? "active" : ""}" onclick="toggleTimer()">⏱️ ${state.timerActive ? formatTimer(state.timerSec) : "Timer"}</button>
            ${!state.quizFinished && answeredCount > 0 ? `<button class="icon-btn active" onclick="finishQuiz()">✓ Selesai</button>` : ""}
            <button class="icon-btn" onclick="resetQuiz()">🔄</button>
          </div>
        </div>
      `;

      if (state.quizFinished) {
        const correct = session.filter(item => isQCorrect(item.origQ, state.quizAnswers[`${item.subjId}_${item.qIdx}`])).length;
        const wrongCount = session.filter(item => { const a = state.quizAnswers[`${item.subjId}_${item.qIdx}`]; return a !== undefined && !isQCorrect(item.origQ, a); }).length;
        const score = Math.round((correct / session.length) * 100);
        const nextIdx = (typeof state.subjectIdx === "number" && state.subjectIdx < DATA.length - 1) ? state.subjectIdx + 1 : 0;

        return `
          ${toolbar}
          <div class="card score-banner">
            <div style="font-size:13px;font-weight:700;color:var(--muted);">${score >= 80 ? "🎉 Mantap! Target ≥80% Tercapai" : "💪 Sedikit Lagi!"}</div>
            <div class="score-big">${score}</div>
            <div style="margin:6px 0 16px;font-size:14px;">Benar <b>${correct}</b> dari <b>${session.length}</b> soal</div>
            <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;">
              <button class="btn" onclick="reviewQuiz()">🔍 Pembahasan</button>
              ${wrongCount > 0 ? `<button class="btn btn-warn" onclick="retryWrong()">🎯 Ulangi ${wrongCount} Salah</button>` : ""}
              ${score >= 80 && !isMixedUTM() && !state.cramMode ? `<button class="btn btn-primary" onclick="openSubject(${nextIdx})">Lanjut: ${DATA[nextIdx].short} →</button>` : `<button class="btn btn-primary" onclick="resetQuiz()">🔄 Mulai Baru</button>`}
              <button class="btn" onclick="goHome()">🏠 Beranda</button>
            </div>
          </div>
        `;
      }

      const item = session[state.quizIdx];
      const key = `${item.subjId}_${item.qIdx}`;
      const userOrigAns = state.quizAnswers[key];
      const answered = userOrigAns !== undefined;
      const isStarred = !!state.starredQ[key];
      const keys = ["A", "B", "C", "D"];

      const dotsHtml = `
        <div class="q-dots">
          ${session.map((it, idx) => {
            const a = state.quizAnswers[`${it.subjId}_${it.qIdx}`];
            let cls = idx === state.quizIdx ? "cur" : "";
            if (a !== undefined) cls += (isQCorrect(it.origQ, a) ? " ok" : " bad");
            return `<button class="q-dot ${cls}" onclick="jumpQuiz(${idx})">${idx + 1}</button>`;
          }).join("")}
        </div>
      `;

      const qType = item.origQ.type || "pg";
      const typeLabels = { pg: "Pilihan Ganda", tf: "Benar / Salah", fill: "Isian Singkat", match: "Cocokkan Pasangan", order: "Urutkan Langkah" };
      const correctNow = isQCorrect(item.origQ, userOrigAns);
      let bodyHtml = "";

      if (qType === "pg") {
        bodyHtml = `<div class="opt-list">
          ${item.displayOpts.map((opt, idx) => {
            let cls = "";
            if (answered) { if (opt.isAns) cls = "correct"; else if (opt.origIdx === userOrigAns) cls = "wrong"; }
            return `<button class="opt-btn ${cls}" ${answered ? "disabled" : ""} onclick="answerQuiz('${key}', ${opt.origIdx})"><span class="opt-key">${keys[idx]}.</span><span>${opt.text}</span></button>`;
          }).join("")}
        </div>`;
      } else if (qType === "tf") {
        const tfAns = item.origQ.ans;
        bodyHtml = `<div class="opt-list" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          ${[true, false].map(val => {
            let cls = "";
            if (answered) {
              if (val === tfAns) cls = "correct";
              else if (!correctNow) cls = "wrong";
            }
            return `<button class="opt-btn ${cls}" style="justify-content:center;font-weight:700;" ${answered ? "disabled" : ""} onclick="answerQuiz('${key}', ${val === tfAns})">${val ? "✅ BENAR" : "❌ SALAH"}</button>`;
          }).join("")}
        </div>`;
      } else if (qType === "fill") {
        const savedFill = (state.fillInputs[key] || "").replace(/"/g, "&quot;");
        bodyHtml = `
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input class="input-field" style="flex:1;min-width:180px;" id="fillInput_${key}" type="text" value="${savedFill}" placeholder="Ketik jawaban di sini..." ${answered ? "disabled" : ""} onkeydown="if(event.key==='Enter') checkFill('${key}')" />
            ${!answered ? `<button class="btn btn-primary" onclick="checkFill('${key}')">Cek Jawaban</button>` : ""}
          </div>
          ${answered && !correctNow ? `<div style="margin-top:8px;font-size:13px;color:var(--success);">Kunci: <b>${item.origQ.accept[0]}</b></div>` : ""}
        `;
      } else if (qType === "match") {
        const stM = state.matchTemp || { selLeft: null, pairs: {} };
        const matchedCount = Object.keys(stM.pairs).length;
        const rightPairNum = {};
        Object.entries(stM.pairs).forEach(([li, rTxt]) => { rightPairNum[rTxt] = parseInt(li, 10) + 1; });
        bodyHtml = `
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Tap item kiri, lalu tap pasangannya di kanan (${matchedCount}/${item.origQ.pairs.length} terpasang):</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div style="display:flex;flex-direction:column;gap:6px;">
              ${item.origQ.pairs.map((pr, li) => {
                const isUsed = stM.pairs[li] !== undefined;
                const isSel = stM.selLeft === li;
                return `<button class="opt-btn" style="padding:9px;font-size:12.5px;${isSel?'border-color:var(--primary);background:var(--primary-bg);':''}${isUsed?'border-color:var(--primary);opacity:0.85;':''}" ${answered ? "disabled" : ""} onclick="pickMatchLeft(${li})"><span class="opt-key">[${li + 1}]</span><span>${pr[0]}</span></button>`;
              }).join("")}
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              ${item.rightShuffled.map((rText, ri) => {
                const pNum = rightPairNum[rText];
                return `<button class="opt-btn" style="padding:9px;font-size:12.5px;${pNum?'border-color:var(--primary);background:var(--primary-bg);':''}" ${answered ? "disabled" : ""} onclick="pickMatchRight('${key}', ${ri})">${pNum ? `<span class="opt-key">[${pNum}]</span>` : ""}<span>${rText}</span></button>`;
              }).join("")}
            </div>
          </div>
          ${!answered && matchedCount > 0 ? `<div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn" onclick="state.matchTemp=null; render();">↺ Ulang Pasangan</button>
            ${matchedCount === item.origQ.pairs.length ? `<button class="btn btn-primary" style="flex:1;" onclick="submitMatch('${key}')">Cek Pasangan ✓</button>` : ""}
          </div>` : ""}
        `;
      } else if (qType === "order") {
        const picked = state.orderTemp || [];
        bodyHtml = `
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Tap item sesuai urutan yang benar (${picked.length}/${item.origQ.items.length}):</div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${item.orderShuffled.map((txt, oi) => {
              const pos = picked.indexOf(txt);
              return `<button class="opt-btn" style="padding:9px 11px;font-size:13px;${pos>=0?'border-color:var(--primary);background:var(--primary-bg);':''}" ${answered || pos >= 0 ? "disabled" : ""} onclick="pickOrderItem('${key}', ${oi})"><span class="opt-key">${pos >= 0 ? pos + 1 : "○"}</span><span>${txt}</span></button>`;
            }).join("")}
          </div>
          ${!answered ? `<div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn" onclick="state.orderTemp=[]; render();">↺ Ulang Urutan</button>
            ${picked.length === item.origQ.items.length ? `<button class="btn btn-primary" style="flex:1;" onclick="submitOrder('${key}')">Cek Urutan ✓</button>` : ""}
          </div>` : ""}
        `;
      }

      return `
        ${toolbar}
        ${dotsHtml}
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="q-num">SOAL ${state.quizIdx + 1} / ${session.length} • ${typeLabels[qType]} ${(isMixedUTM() || state.cramMode) ? `• ${item.subjShort}` : ""}</span>
            <button class="icon-btn ${isStarred ? "active" : ""}" style="font-size:11.5px;padding:4px 9px;" onclick="toggleStarQ('${key}')">${isStarred ? "★ Ditandai" : "☆ Tandai"}</button>
          </div>
          <div class="q-text">${item.origQ.q}</div>
          ${bodyHtml}
          ${answered ? `<div class="explain-box"><b>${correctNow ? "✅ Benar!" : "❌ Kurang tepat."}</b> ${item.origQ.exp}</div>` : ""}
          <div class="quiz-nav">
            <button class="btn" ${state.quizIdx === 0 ? "disabled" : ""} onclick="moveQuiz(-1)">← Sebelumnya</button>
            ${state.quizIdx < session.length - 1 ? `<button class="btn btn-primary" onclick="moveQuiz(1)">Berikutnya →</button>` : `<button class="btn btn-primary" onclick="finishQuiz()">Selesai ✓</button>`}
          </div>
        </div>
      `;
    }

    function attachSwipe() {
      const el = document.getElementById("fcCardEl");
      if (!el) return;
      let startX = 0;
      el.addEventListener("touchstart", e => { startX = e.changedTouches[0].screenX; }, { passive: true });
      el.addEventListener("touchend", e => { const diff = e.changedTouches[0].screenX - startX; if (Math.abs(diff) > 55) moveCard(diff < 0 ? 1 : -1); }, { passive: true });
    }

    function render() {
      updateHeader();
      renderStepper();
      const area = document.getElementById("contentArea");
      if (state.view === "home") { area.innerHTML = renderHome(); return; }
      if (isMixedUTM() || state.cramMode || state.mode === "quiz") area.innerHTML = renderQuiz();
      else if (state.mode === "summary") area.innerHTML = renderSummary();
      else if (state.mode === "cheatsheet") area.innerHTML = renderCheatSheet();
      else if (state.mode === "flashcard") { area.innerHTML = renderFlashcard(); attachSwipe(); }
    }

    window.goHome = () => { state.view = "home"; state.cramMode = false; render(); };
    window.openSubject = (i) => {
      state.view = "study";
      state.subjectIdx = i;
      state.cramMode = false;
      state.fcIdx = 0;
      state.fcFlipped = false;
      state.quizSession = null;
      state.quizFinished = false;
      state.search = "";
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    window.setMode = (m) => { state.mode = m; state.quizFinished = false; saveState(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    window.completeStep = (stepKey, nextMode) => {
      const s = currentSubject();
      state.readiness[`${s.id}_${stepKey}`] = true;
      state.mode = nextMode;
      saveState();
      showToast("✓ Progres tersimpan! Lanjut langkah berikutnya.");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    window.startMixedUTM = () => { state.view = "study"; state.subjectIdx = "mixed_utm"; state.cramMode = false; state.mode = "quiz"; state.quizSession = null; buildQuizSession(); render(); };
    window.startCramMode = () => { state.view = "study"; state.subjectIdx = "mixed_utm"; state.cramMode = true; state.mode = "quiz"; state.quizSession = null; buildQuizSession(); render(); };
    window.onSearch = (val) => { state.search = val; render(); };
    window.saveNote = (id, val) => { state.notes[id] = val; saveState(); };
    window.saveEssay = (k, val) => { state.essayDrafts[k] = val; saveState(); };
    window.flipCard = () => { state.fcFlipped = !state.fcFlipped; render(); };
    window.moveCard = (delta) => { const deck = getDeck(); if (!deck.length) return; state.fcIdx = (state.fcIdx + delta + deck.length) % deck.length; state.fcFlipped = false; render(); };
    window.rateSM2 = (origIdx, days, label) => {
      const s = currentSubject(), k = `${s.id}_${origIdx}`;
      if (days >= 1) state.learned[k] = true; else delete state.learned[k];
      state.sm2[k] = { next: Date.now() + days * 86400000, label };
      saveState();
      moveCard(1);
    };
    window.toggleStarFC = (origIdx) => { const s = currentSubject(), k = `${s.id}_${origIdx}`; if (state.starredFC[k]) delete state.starredFC[k]; else state.starredFC[k] = true; saveState(); render(); };
    window.setFCFilter = (f) => { state.fcFilter = f; state.fcIdx = 0; state.fcFlipped = false; render(); };
    window.toggleStarQ = (key) => { if (state.starredQ[key]) delete state.starredQ[key]; else state.starredQ[key] = true; saveState(); render(); };
    window.answerQuiz = (key, val) => { state.quizAnswers[key] = val; state.matchTemp = null; state.orderTemp = null; saveState(); render(); };
    window.checkFill = (key) => {
      const inp = document.getElementById("fillInput_" + key);
      if (!inp) return;
      const rawVal = inp.value.trim();
      const val = rawVal.toLowerCase();
      if (!val) return showToast("Ketik jawaban dulu");
      state.fillInputs[key] = rawVal;
      const item = state.quizSession[state.quizIdx];
      const ok = item.origQ.accept.some(a => a.toLowerCase() === val);
      answerQuiz(key, ok);
    };
    window.pickMatchLeft = (li) => {
      if (!state.matchTemp) state.matchTemp = { selLeft: null, pairs: {} };
      state.matchTemp.selLeft = li;
      render();
    };
    window.pickMatchRight = (key, ri) => {
      if (!state.matchTemp || state.matchTemp.selLeft === null) return showToast("Pilih item di sebelah kiri dulu");
      const item = state.quizSession[state.quizIdx];
      state.matchTemp.pairs[state.matchTemp.selLeft] = item.rightShuffled[ri];
      state.matchTemp.selLeft = null;
      render();
    };
    window.submitMatch = (key) => {
      const item = state.quizSession[state.quizIdx];
      const ok = item.origQ.pairs.every((pr, li) => state.matchTemp && state.matchTemp.pairs[li] === pr[1]);
      answerQuiz(key, ok);
    };
    window.pickOrderItem = (key, oi) => {
      const item = state.quizSession[state.quizIdx];
      if (!state.orderTemp) state.orderTemp = [];
      state.orderTemp.push(item.orderShuffled[oi]);
      render();
    };
    window.submitOrder = (key) => {
      const item = state.quizSession[state.quizIdx];
      const ok = item.origQ.items.every((txt, idx) => state.orderTemp && state.orderTemp[idx] === txt);
      answerQuiz(key, ok);
    };
    window.jumpQuiz = (idx) => { state.quizIdx = idx; state.matchTemp = null; state.orderTemp = null; render(); };
    window.moveQuiz = (delta) => { state.quizIdx = Math.max(0, Math.min(state.quizSession.length - 1, state.quizIdx + delta)); state.matchTemp = null; state.orderTemp = null; render(); };
    window.finishQuiz = () => { state.quizFinished = true; if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; state.timerActive = false; } render(); };
    window.reviewQuiz = () => { state.quizFinished = false; state.quizIdx = 0; render(); };
    window.toggleShuffleQuiz = () => { state.shuffleQuiz = !state.shuffleQuiz; buildQuizSession(); render(); };
    window.toggleStarredQuiz = () => { state.onlyStarredQuiz = !state.onlyStarredQuiz; buildQuizSession(); render(); };
    window.retryWrong = () => {
      const wrongItems = state.quizSession.filter(item => { const k = `${item.subjId}_${item.qIdx}`; return state.quizAnswers[k] !== undefined && !isQCorrect(item.origQ, state.quizAnswers[k]); });
      if (!wrongItems.length) return;
      wrongItems.forEach(item => delete state.quizAnswers[`${item.subjId}_${item.qIdx}`]);
      saveState();
      state.quizSession = wrongItems; state.quizIdx = 0; state.quizFinished = false; render();
    };
    window.resetQuiz = () => { if (state.quizSession) state.quizSession.forEach(item => { const k = `${item.subjId}_${item.qIdx}`; delete state.quizAnswers[k]; delete state.fillInputs[k]; }); saveState(); buildQuizSession(); render(); };
    window.toggleTimer = () => {
      if (state.timerActive) { clearInterval(state.timerHandle); state.timerHandle = null; state.timerActive = false; render(); }
      else {
        state.timerActive = true; state.timerSec = (state.quizSession ? state.quizSession.length : 20) * 60;
        state.timerHandle = setInterval(() => { state.timerSec--; if (state.timerSec <= 0) { clearInterval(state.timerHandle); state.timerHandle = null; state.timerActive = false; state.quizFinished = true; } render(); }, 1000);
        render();
      }
    };
    window.updateCM = (field, val) => { state.cm[field] = Math.max(0, parseInt(val, 10) || 0); render(); };
    window.setStatLabType = (t) => { state.statLab.type = t; render(); };
    window.updateStatLab = (field, val) => { state.statLab[field] = parseFloat(val); render(); };
    window.stopSpeech = () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      state.isSpeaking = false;
      render();
      showToast("⏹ Audio dihentikan");
    };
    window.speakText = (txt) => {
      if (!("speechSynthesis" in window)) return showToast("Browser tidak mendukung Audio TTS");
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt); u.lang = "id-ID"; u.rate = 1.05;
      state.isSpeaking = true;
      u.onend = () => { state.isSpeaking = false; render(); };
      u.onerror = () => { state.isSpeaking = false; render(); };
      window.speechSynthesis.speak(u);
      render();
      showToast("🔊 Membacakan...");
    };
    window.speakSummary = () => { const s = currentSubject(); if (s) speakText(s.sections.map(sec => `${sec.title}. ${(sec.bullets || []).join(" ").replace(/<[^>]+>/g, "")}`).join(" ")); };
    window.openModal = (id) => { document.getElementById(id).classList.add("open"); if (id === "toolsModal") calcUTGrade(); if (id === "searchModal") setTimeout(() => document.getElementById("globalSearchInput").focus(), 100); };
    window.closeModal = (id) => document.getElementById(id).classList.remove("open");
    window.renderGlobalSearch = (q) => {
      const box = document.getElementById("globalSearchResults"), term = q.trim().toLowerCase();
      if (term.length < 2) { box.innerHTML = `<div style="font-size:12.5px;color:var(--muted);">Ketik minimal 2 huruf...</div>`; return; }
      let html = "";
      DATA.forEach((s, si) => s.sections.forEach(sec => {
        const hay = (sec.title + " " + (sec.bullets || []).join(" ")).replace(/<[^>]+>/g, "");
        if (hay.toLowerCase().includes(term)) html += `<div class="cheat-box" style="margin-bottom:8px;cursor:pointer;" onclick="closeModal('searchModal'); openSubject(${si}); setMode('summary');"><div style="font-size:11.5px;font-weight:700;color:var(--primary);">${s.icon} ${s.short} — ${sec.title}</div><div style="font-size:12.5px;color:var(--muted);margin-top:3px;">${hay.slice(0, 140)}...</div></div>`;
      }));
      box.innerHTML = html || `<div style="font-size:13px;color:var(--muted);">Tidak ditemukan hasil untuk "${q}".</div>`;
    };
    function updatePomoUI() {
      const t = formatTimer(state.pomoSec);
      const mini = document.getElementById("pomoMini");
      mini.textContent = t;
      mini.style.display = state.pomoHandle ? "inline" : "none";
      document.getElementById("pomoBigTime").textContent = t;
      document.getElementById("pomoPhaseLbl").textContent = `${t} • ${state.pomoPhase === "FOKUS" ? "Sesi Fokus" : "Istirahat"}`;
      document.getElementById("pomoStartBtn").textContent = state.pomoHandle ? "⏸" : "▶";
    }
    window.togglePomodoro = () => {
      if (state.pomoHandle) { clearInterval(state.pomoHandle); state.pomoHandle = null; updatePomoUI(); return; }
      state.pomoHandle = setInterval(() => {
        state.pomoSec--;
        if (state.pomoSec <= 0) { clearInterval(state.pomoHandle); state.pomoHandle = null; showToast(state.pomoPhase === "FOKUS" ? "⏰ Fokus selesai! Istirahat 5m." : "⏰ Lanjut fokus!"); state.pomoPhase = state.pomoPhase === "FOKUS" ? "ISTIRAHAT" : "FOKUS"; state.pomoSec = (state.pomoPhase === "FOKUS" ? 25 : 5) * 60; }
        updatePomoUI();
      }, 1000);
      updatePomoUI();
    };
    window.resetPomodoro = (mins) => { if (state.pomoHandle) { clearInterval(state.pomoHandle); state.pomoHandle = null; } state.pomoPhase = mins === 25 ? "FOKUS" : "ISTIRAHAT"; state.pomoSec = mins * 60; updatePomoUI(); };
    window.calcUTGrade = () => {
      const tuton = Math.max(0, Math.min(100, parseFloat(document.getElementById("calcTuton").value) || 0));
      const uas = Math.max(0, Math.min(100, parseFloat(document.getElementById("calcUAS").value) || 0));
      const eligible = uas >= 30;
      const finalScore = eligible ? (0.3 * tuton + 0.7 * uas) : uas;
      const grade = finalScore >= 80 ? "A" : (finalScore >= 70 ? "B" : (finalScore >= 55 ? "C" : "D/E"));
      document.getElementById("calcUTResult").innerHTML = `Estimasi: <b>${finalScore.toFixed(1)}</b> (Grade <b>${grade}</b>)${!eligible ? ` • <span style="color:var(--danger);">UAS &lt; 30: Tuton hangus!</span>` : ""}`;
    };
    window.exportProgress = () => {
      const payload = { learned: state.learned, sm2: state.sm2, starredFC: state.starredFC, starredQ: state.starredQ, readiness: state.readiness, notes: state.notes, quizAnswers: state.quizAnswers, essayDrafts: state.essayDrafts };
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      document.getElementById("syncBox").value = code;
      navigator.clipboard?.writeText(code).catch(() => {});
      showToast("📤 Kode progress disalin!");
    };
    window.importProgress = () => {
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("syncBox").value.trim()))));
        ["learned","sm2","starredFC","starredQ","readiness","notes","quizAnswers","essayDrafts"].forEach(k => { if (data[k]) state[k] = data[k]; });
        saveState(); render(); showToast("✅ Progress dimuat!");
      } catch (e) { showToast("❌ Kode tidak valid"); }
    };

    let resetConfirm = false;
    window.resetAllProgress = () => {
      const btn = document.getElementById("resetAllBtn");
      if (!resetConfirm) {
        resetConfirm = true;
        btn.textContent = "Yakin Reset?";
        setTimeout(() => { resetConfirm = false; if (btn) btn.textContent = "🗑️ Reset"; }, 3000);
        return;
      }
      ["ut_learned","ut_sm2","ut_starred_fc","ut_starred_q","ut_readiness","ut_notes","ut_quiz","ut_fill","ut_essays"].forEach(k => localStorage.removeItem(k));
      state.learned = {}; state.sm2 = {}; state.starredFC = {}; state.starredQ = {};
      state.readiness = {}; state.notes = {}; state.quizAnswers = {}; state.fillInputs = {}; state.essayDrafts = {};
      state.quizSession = null; state.view = "home";
      resetConfirm = false;
      closeModal("toolsModal");
      render();
      showToast("🗑️ Semua progress berhasil direset");
    };

    window.addEventListener("keydown", e => {
      if (state.view === "study" && state.mode === "flashcard" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        if (e.key === "ArrowRight") moveCard(1);
        else if (e.key === "ArrowLeft") moveCard(-1);
        else if (e.key === " ") { e.preventDefault(); flipCard(); }
      }
    });
    window.addEventListener("resize", renderStepper);
    initTheme();
    updatePomoUI();
    render();
  </script>
</body>
</html>
