<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>UT Prep Hub Pro — Sains Data UT Bandung (Sem 3)</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #1e293b;
      --card: #1e293b;
      --card-2: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-bg: rgba(56, 189, 248, 0.14);
      --accent: #a78bfa;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    html.light {
      --bg: #f8fafc;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-bg: rgba(2, 132, 199, 0.1);
      --accent: #7c3aed;
      --success: #059669;
      --success-bg: rgba(5, 150, 105, 0.1);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.1);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      font-size: 15px;
      padding-bottom: 84px;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .header-top {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
    .brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .pill-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--warning-bg);
      color: var(--warning);
      white-space: nowrap;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12.5px;
      cursor: pointer;
      font-weight: 600;
    }
    .icon-btn.active {
      border-color: var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
    }
    .subject-bar {
      max-width: 920px;
      margin: 9px auto 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .subject-bar::-webkit-scrollbar { display: none; }
    .subj-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 12px;
      padding: 7px 11px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .subj-btn.active {
      border-color: var(--primary);
      background: var(--primary-bg);
      color: var(--text);
    }
    .subj-btn .s-title { display: block; font-size: 13px; font-weight: 700; }
    .subj-btn .s-meta { display: block; font-size: 10.5px; color: var(--muted); }
    .subj-btn.active .s-meta { color: var(--primary); }

    .container { max-width: 920px; margin: 0 auto; padding: 12px 14px; }

    /* Desktop mode tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
      background: var(--card);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active { background: var(--primary); color: #082f49; }
    html.light .mode-btn.active { color: #ffffff; }

    /* Mobile bottom nav */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .bnav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .bnav-btn span.b-ico { font-size: 17px; line-height: 1; }
    .bnav-btn.active { color: var(--primary); background: var(--primary-bg); }
    @media (max-width: 768px) {
      .mode-tabs { display: none; }
      .bottom-nav { display: grid; }
    }

    .overview-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .overview-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .progress-bar-wrap {
      width: 100%;
      height: 7px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 9px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.25s ease;
    }
    .readiness-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .check-chip {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .check-chip.done {
      border-color: var(--success);
      background: var(--success-bg);
      color: var(--success);
    }

    /* Accordion */
    .acc-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .acc-head {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }
    .acc-body {
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
      display: none;
      font-size: 14px;
    }
    .acc-item.open .acc-body { display: block; }
    .acc-item.open .acc-chevron { transform: rotate(180deg); }
    .acc-chevron { transition: transform 0.2s ease; color: var(--muted); }
    .acc-body ul { padding-left: 18px; margin: 10px 0 0; }
    .acc-body li { margin-bottom: 6px; }
    .tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-bg);
      color: var(--primary);
      margin-right: 6px;
    }
    .cheat-table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--card-2); font-weight: 700; }

    /* Cheat Sheet Grid */
    .cheat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 10px;
    }
    .cheat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
    }
    .cheat-box h3 {
      margin: 0 0 8px;
      font-size: 13.5px;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .cheat-box ul { margin: 0; padding-left: 17px; font-size: 13px; }
    .cheat-box li { margin-bottom: 5px; }
    code {
      background: var(--card-2);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    /* Flashcard */
    .fc-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .fc-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      min-height: 230px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
      user-select: none;
      position: relative;
      touch-action: pan-y;
    }
    .fc-card.flipped { border-color: var(--primary); background: var(--card-2); }
    .fc-star {
      position: absolute;
      top: 12px;
      right: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .fc-star.marked { border-color: var(--warning); color: var(--warning); background: var(--warning-bg); }
    .fc-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .fc-text { font-size: 17px; font-weight: 600; max-width: 640px; }
    .fc-card.flipped .fc-text { font-size: 15px; font-weight: 500; }
    .fc-hint { font-size: 11.5px; color: var(--muted); margin-top: 14px; }
    .fc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #082f49; border-color: transparent; }
    html.light .btn-primary { color: #ffffff; }
    .btn-success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
    .btn-warn { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }

    /* Quiz */
    .quiz-toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .q-num { font-size: 12px; font-weight: 700; color: var(--primary); }
    .q-text { font-size: 15.5px; font-weight: 600; margin: 8px 0 14px; }
    .opt-list { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 12px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .opt-btn.correct { background: var(--success-bg); border-color: var(--success); }
    .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); }
    .opt-key { font-weight: 800; min-width: 22px; color: var(--primary); }
    .explain-box {
      margin-top: 13px;
      padding: 12px;
      border-radius: 12px;
      background: var(--primary-bg);
      border-left: 4px solid var(--primary);
      font-size: 13.5px;
    }
    .quiz-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
    .score-banner { text-align: center; padding: 20px 14px; }
    .score-big { font-size: 42px; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .timer-pill {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--danger-bg);
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <h1>UT Prep Hub Pro — Sains Data</h1>
        <p>UT Bandung • Sem 3 Lengkap (UTM &amp; UO)</p>
      </div>
      <div class="header-actions">
        <span class="pill-badge" id="countdownBadge">H-3 UTM</span>
        <button class="icon-btn" id="themeBtn" title="Ganti Tema">☀️/🌙</button>
      </div>
    </div>
    <nav class="subject-bar" id="subjectBar"></nav>
  </header>

  <main class="container">
    <section class="overview-card" id="overviewCard"></section>

    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="summary">📖 Ringkasan</button>
      <button class="mode-btn" data-mode="cheatsheet">⚡ Cheat Sheet</button>
      <button class="mode-btn" data-mode="flashcard">🃏 Flashcard</button>
      <button class="mode-btn" data-mode="quiz">📝 Kuis</button>
    </div>

    <div id="contentArea"></div>
  </main>

  <nav class="bottom-nav">
    <button class="bnav-btn active" data-mode="summary"><span class="b-ico">📖</span><span>Materi</span></button>
    <button class="bnav-btn" data-mode="cheatsheet"><span class="b-ico">⚡</span><span>Rumus</span></button>
    <button class="bnav-btn" data-mode="flashcard"><span class="b-ico">🃏</span><span>Kartu</span></button>
    <button class="bnav-btn" data-mode="quiz"><span class="b-ico">📝</span><span>Kuis</span></button>
  </nav>

  <script>
    const DATA = [
      {
        id: "bigdata",
        code: "STDA4202",
        short: "Big Data",
        name: "Analitik Big Data",
        exam: "UTM 28 Nov",
        icon: "📊",
        note: "Study Guide (BMP Sementara) • 5V, Arsitektur, Hadoop/Spark, Clustering, Forecasting, Classification, Medsos.",
        sections: [
          {
            title: "1. Konsep Dasar Big Data (5V & Jenis Data)",
            tag: "Wajib Hafal",
            bullets: [
              "<b>5V Big Data</b>: <b>Volume</b> (ukuran sangat besar), <b>Velocity</b> (kecepatan aliran/real-time), <b>Variety</b> (keragaman format), <b>Veracity</b> (akurasi & keandalan data), <b>Value</b> (nilai bisnis yang diekstrak).",
              "<b>Jenis Data</b>: Terstruktur (RDBMS/tabel), Semiterstruktur (JSON, XML), Tidak terstruktur (teks bebas, gambar, video).",
              "<b>4 Tipe Analytics</b>: <i>Descriptive</i> (apa yg terjadi), <i>Diagnostic</i> (mengapa terjadi), <i>Predictive</i> (apa yg akan terjadi), <i>Prescriptive</i> (rekomendasi tindakan)."
            ]
          },
          {
            title: "2. Lifecycle & Arsitektur Big Data",
            tag: "Konsep Inti",
            bullets: [
              "<b>Lifecycle</b>: Collection → Storage (Data Lake/Warehouse) → Processing (Batch/Real-time) → Analysis → Visualization → Decision Making.",
              "<b>Arsitektur Layer</b>: Sumber Data → <i>Ingestion Layer</i> (Apache Kafka, Flume) → <i>Storage Layer</i> (HDFS / Data Lake vs Amazon Redshift / Data Warehouse) → <i>Processing Layer</i> (Hadoop / Spark) → <i>Analytics Layer</i> (ML/Statistik) → <i>Visualization</i> (Tableau, Power BI)."
            ]
          },
          {
            title: "3. Hadoop Ecosystem & Apache Spark",
            tag: "Teknologi",
            bullets: [
              "<b>Hadoop</b>: <b>HDFS</b> (penyimpanan terdistribusi berbasis blok + replikasi fault-tolerant), <b>MapReduce</b> (tahap <i>Map</i>: ubah ke key-value; tahap <i>Reduce</i>: agregasi/gabung hasil), <b>YARN</b> (manajer sumber daya klaster).",
              "<b>Ekosistem Hadoop</b>: <b>Hive</b> (query SQL-like), <b>Pig</b> (pemrograman data flow), <b>HBase</b> (NoSQL), <b>Spark</b> (pemrosesan <i>in-memory</i> super cepat).",
              "<b>Arsitektur Spark</b>: <b>Driver</b> (mengelola eksekusi & membangun <b>DAG</b>) + <b>Cluster Manager</b> (YARN/Mesos/Kubernetes).",
              "<b>RDD (Resilient Distributed Dataset)</b>: struktur data dasar Spark yang <i>immutable</i> & terpartisi. <b>Transformations</b> (bikin RDD baru: <code>map</code>, <code>filter</code>, <code>reduceByKey</code>) vs <b>Actions</b> (eksekusi & kembalikan nilai: <code>count</code>, <code>collect</code>, <code>saveAsTextFile</code>).",
              "<b>Modul Spark</b>: Spark SQL, Spark Streaming, <b>MLlib</b> (machine learning), <b>GraphX</b> (analisis graf)."
            ]
          },
          {
            title: "4. Metode Lanjut: Clustering, Forecasting, Classification",
            tag: "Algoritma",
            table: {
              headers: ["Metode", "Tipe & Tujuan", "Algoritma Utama", "Metrik Evaluasi"],
              rows: [
                ["<b>Clustering</b>", "Unsupervised; kelompokkan data mirip tanpa label", "K-Means (Hard), GMM (Soft), Hierarchical (Agglomerative/Divisive), DBSCAN (density + deteksi noise), Mean Shift", "Silhouette Score, Davies-Bouldin Index"],
                ["<b>Forecasting</b>", "Prediksi nilai masa depan dari data historis", "Time Series (Trend, Musiman, Siklus, Noise): ARIMA, Exponential Smoothing; Causal: Regresi Linier; Kualitatif: Delphi", "MAE, MSE, RMSE"],
                ["<b>Classification</b>", "Supervised; prediksi kelas/kategori berlabel (Binary, Multiclass, Multilabel)", "Logistic Regression, Decision Tree, Random Forest (ensemble), SVM (hyperplane + kernel trick), KNN, Neural Networks", "Accuracy, Precision, Recall, F1-Score"]
              ]
            }
          },
          {
            title: "5. Big Data untuk Media Sosial",
            tag: "Aplikasi",
            bullets: [
              "<b>Manfaat</b>: Analisis sentimen (NLP), segmentasi pengguna, pemasaran terpersonalisasi, pemantauan tren, deteksi anomali (hoax/penipuan).",
              "<b>Tantangan</b>: Volume real-time tinggi, keberagaman format (teks/gambar/video), kualitas data, serta <b>privasi & keamanan</b> (kepatuhan GDPR, CCPA)."
            ]
          }
        ],
        cheatsheet: [
          { title: "5V Big Data", items: ["<b>Volume</b>: ukuran raksasa", "<b>Velocity</b>: kecepatan real-time", "<b>Variety</b>: terstruktur, semi (JSON/XML), tak terstruktur", "<b>Veracity</b>: akurasi & keandalan", "<b>Value</b>: manfaat bisnis"] },
          { title: "4 Jenis Analytics", items: ["<b>Descriptive</b>: Apa yang terjadi?", "<b>Diagnostic</b>: Mengapa terjadi?", "<b>Predictive</b>: Apa yang akan terjadi?", "<b>Prescriptive</b>: Tindakan apa yang diambil?"] },
          { title: "Hadoop vs Spark", items: ["<b>HDFS</b>: storage blok terdistribusi + replikasi", "<b>MapReduce</b>: disk-based (Map → Reduce)", "<b>YARN</b>: pengatur resource klaster", "<b>Spark</b>: in-memory + DAG + RDD (immutable)", "<b>Spark Modules</b>: SQL, Streaming, MLlib, GraphX"] },
          { title: "Metrik Evaluasi", items: ["<b>Clustering</b>: Silhouette Score, Davies-Bouldin", "<b>Forecasting</b>: MAE, MSE, RMSE", "<b>Classification</b>: Accuracy, Precision, Recall, F1"] }
        ],
        flashcards: [
          { q: "Apa saja 5V karakteristik Big Data?", a: "Volume (jumlah besar), Velocity (kecepatan real-time), Variety (ragam format), Veracity (akurasi/keandalan), Value (nilai yang diekstrak)." },
          { q: "Bedanya Predictive vs Prescriptive Analytics?", a: "Predictive memprediksi apa yang mungkin terjadi di masa depan; Prescriptive memberi rekomendasi tindakan yang harus diambil." },
          { q: "Apa fungsi YARN pada Hadoop?", a: "Yet Another Resource Negotiator: mengelola dan mengalokasikan sumber daya klaster agar berbagai aplikasi (bukan hanya MapReduce) bisa berjalan di atas Hadoop." },
          { q: "Apa beda Transformations dan Actions pada Spark RDD?", a: "Transformations menghasilkan RDD baru (misal map, filter, reduceByKey); Actions mengembalikan nilai ke Driver atau menyimpan hasil (misal count, collect)." },
          { q: "Apa keunggulan utama DBSCAN dibanding K-Means?", a: "DBSCAN berbasis kepadatan (density), bisa menemukan klaster berbentuk arbitrer, tidak perlu tentukan K di awal, dan mampu mengidentifikasi noise/outlier." },

          { q: "Jika A dan B independen dengan P(A) = 0,4 dan P(B) = 0,5, maka P(A ∪ B) adalah...", opts: ["0,20", "0,70", "0,90", "0,10"], ans: 1, exp: "P(A∩B) = 0,4 × 0,5 = 0,20. P(A∪B) = 0,4 + 0,5 − 0,2 = 0,70." },
          { q: "Diketahui E[X] = 5 dan E[X²] = 29. Nilai dari Var(2X − 3) adalah...", opts: ["4", "8", "16", "13"], ans: 2, exp: "Var(X) = 29 − 25 = 4. Var(2X − 3) = 2² × 4 = 16." },
          { q: "Fungsi distribusi kumulatif (CDF) F(x) dari variabel random kontinu X memenuhi hubungan...", opts: ["f(x) = ∫ F(x) dx", "f(x) = F'(x)", "F(x) = f'(x)", "F(x) = 1 − f(x)"], ans: 1, exp: "Fungsi densitas f(x) adalah turunan pertama dari CDF F(x)." },
          { q: "Variabel random X dan Y independen jika fungsi densitas bersamanya memenuhi...", opts: ["f(x,y) = f_X(x) + f_Y(y)", "f(x,y) = f_X(x) · f_Y(y)", "Cov(X,Y) = 1", "E[X+Y] = E[X] + E[Y]"], ans: 1, exp: "Syarat perlu dan cukup independensi: f(x,y) = f_X(x) · f_Y(y)." },
          { q: "Jika MGF variabel random X adalah M_X(t) = e^(3t + 2t²), maka nilai E[X] adalah...", opts: ["2", "3", "4", "6"], ans: 1, exp: "E[X] = M'_X(0) = (3 + 4t)e^(3t+2t²) pada t=0, hasilnya 3." },
          { q: "Distribusi diskrit yang memiliki nilai rata-rata dan variansi sama besar (E[X] = Var(X) = λ) adalah...", opts: ["Binomial", "Geometrik", "Poisson", "Hipergeometrik"], ans: 2, exp: "Pada distribusi Poisson(λ), mean dan variansi sama-sama bernilai λ." },
          { q: "Sifat 'memoryless' P(X > a + t | X > a) = P(X > t) dimiliki oleh distribusi kontinu...", opts: ["Normal", "Beta", "Eksponensial", "Uniform"], ans: 2, exp: "Distribusi Eksponensial adalah satu-satunya distribusi kontinu dengan sifat memoryless." },
          { q: "Misalkan X ~ Uniform(0, 1) dan Y = 2X + 1. Fungsi densitas dari Y untuk 1 < y < 3 adalah...", opts: ["h(y) = 2", "h(y) = 1/2", "h(y) = 1", "h(y) = y/2"], ans: 1, exp: "x = (y−1)/2 → |dx/dy| = 1/2 → h(y) = 1 · (1/2) = 1/2." },
          { q: "Berdasarkan Teorema Limit Pusat (CLT), untuk n → ∞, distribusi (X̄ − μ)/(σ/√n) mendekati...", opts: ["Poisson(1)", "Eksponensial(1)", "Normal Standar N(0, 1)", "Uniform(0, 1)"], ans: 2, exp: "CLT menjamin rata-rata sampel terstandardisasi konvergen ke Normal Standar N(0,1)." },
          { q: "Diketahui f(x) = cx untuk 0 < x < 2 (dan 0 selainnya). Agar f(x) merupakan fungsi densitas (PDF) yang sah, nilai c adalah...", opts: ["1/4", "1/2", "1", "2"], ans: 1, exp: "∫₀² cx dx = c·[x²/2]₀² = 2c = 1 → c = 1/2." },
          { q: "Jika X ~ Binomial(n = 10, p = 0,3), maka nilai E[X] dan Var(X) berturut-turut adalah...", opts: ["3 dan 2,1", "3 dan 3", "7 dan 2,1", "0,3 dan 0,21"], ans: 0, exp: "E[X] = np = 10 × 0,3 = 3; Var(X) = np(1−p) = 3 × 0,7 = 2,1." },
          { q: "Dari 10 bola (4 merah, 6 biru), diambil 3 bola sekaligus TANPA pengembalian. Banyaknya bola merah yang terambil mengikuti distribusi...", opts: ["Binomial", "Hipergeometrik", "Poisson", "Geometrik"], ans: 1, exp: "Pengambilan sampel tanpa pengembalian dari populasi terbatas mengikuti distribusi Hipergeometrik." },
          { q: "Jika X dan Y adalah dua variabel random independen dengan Var(X) = 4 dan Var(Y) = 9, maka nilai Var(X − Y) adalah...", opts: ["−5", "5", "13", "36"], ans: 2, exp: "Karena independen, Cov(X,Y)=0 dan Var(X − Y) = Var(X) + (−1)²Var(Y) = 4 + 9 = 13." },
          { q: "Nilai kuantil ke-0,5 (p = 0,5) dari suatu distribusi probabilitas juga dikenal sebagai...", opts: ["Modus", "Median", "Variansi", "Skewness"], ans: 1, exp: "Kuantil ke-0,5 membagi distribusi menjadi dua bagian sama besar (50% di bawah, 50% di atas), yaitu Median." },
          { q: "Jika diketahui P(A) = 0,6, P(B|A) = 0,5, maka nilai P(A ∩ B) adalah...", opts: ["0,1", "0,3", "0,55", "0,83"], ans: 1, exp: "P(A ∩ B) = P(B|A) · P(A) = 0,5 × 0,6 = 0,3." },
          { q: "Diketahui MGF M_X(t) = (1 − 2t)⁻¹ untuk t < 1/2. Ini merupakan MGF dari distribusi Eksponensial dengan parameter λ = ...", opts: ["1/2", "1", "2", "4"], ans: 0, exp: "MGF Exp(λ) adalah λ / (λ − t) = 1 / (1 − t/λ). Jika 1/(1 − 2t), maka 1/λ = 2 → λ = 1/2." },
          { q: "Jika dua variabel random memiliki Cov(X, Y) = 0, apakah keduanya PASTI independen?", opts: ["Ya, selalu pasti independen", "Tidak selalu (independen → Cov=0, namun kebalikannya tidak selalu berlaku)", "Hanya jika diskrit", "Hanya jika variansi nol"], ans: 1, exp: "Independensi menjamin Cov(X,Y)=0, tetapi Cov(X,Y)=0 hanya berarti tidak ada hubungan linear (bisa tetap dependen non-linear)." },
          { q: "Pada distribusi Uniform diskrit X pada {1, 2, ..., n}, nilai ekspektasi E[X] adalah...", opts: ["n / 2", "(n + 1) / 2", "(n − 1) / 2", "n² / 12"], ans: 1, exp: "E[X] = (1 + 2 + ... + n)/n = [n(n+1)/2]/n = (n + 1)/2." },
          { q: "Dalam Teorema Bayes, probabilitas awal sebelum memperoleh bukti/informasi baru P(B_i) disebut probabilitas...", opts: ["Posterior", "Likelihood", "Prior", "Marginal"], ans: 2, exp: "P(B_i) adalah probabilitas prior, sedangkan P(B_i|A) adalah probabilitas posterior setelah melihat kejadian A." }
        ]
      }
    ];

    let state = {
      subjectIdx: 0, // 0..5 or 'mixed_utm'
      mode: "summary",
      search: "",
      fcIdx: 0,
      fcFlipped: false,
      fcFilter: "all", // 'all' | 'unlearned' | 'starred'
      learned: JSON.parse(localStorage.getItem("ut_learned") || "{}"),
      starredFC: JSON.parse(localStorage.getItem("ut_starred_fc") || "{}"),
      starredQ: JSON.parse(localStorage.getItem("ut_starred_q") || "{}"),
      readiness: JSON.parse(localStorage.getItem("ut_readiness") || "{}"),
      quizAnswers: JSON.parse(localStorage.getItem("ut_quiz") || "{}"),
      quizIdx: 0,
      quizFinished: false,
      shuffleQuiz: false,
      onlyWrongQuiz: false,
      onlyStarredQuiz: false,
      quizSession: null, // array of { subjId, qIdx, origQ, shuffledOpts, mappedAns }
      timerActive: false,
      timerSec: 0,
      timerHandle: null
    };

    const saveState = () => {
      localStorage.setItem("ut_learned", JSON.stringify(state.learned));
      localStorage.setItem("ut_starred_fc", JSON.stringify(state.starredFC));
      localStorage.setItem("ut_starred_q", JSON.stringify(state.starredQ));
      localStorage.setItem("ut_readiness", JSON.stringify(state.readiness));
      localStorage.setItem("ut_quiz", JSON.stringify(state.quizAnswers));
    };

    const initTheme = () => {
      if (localStorage.getItem("ut_theme") === "light") document.documentElement.classList.add("light");
      document.getElementById("themeBtn").onclick = () => {
        document.documentElement.classList.toggle("light");
        localStorage.setItem("ut_theme", document.documentElement.classList.contains("light") ? "light" : "dark");
      };
    };

    const isMixedUTM = () => state.subjectIdx === "mixed_utm";
    const currentSubject = () => isMixedUTM() ? null : DATA[state.subjectIdx];

    const updateCountdown = () => {
      const s = currentSubject();
      const now = new Date();
      let targetStr = "2026-11-28T00:00:00+07:00";
      let label = "UTM";
      if (s && s.exam.includes("29 Nov")) targetStr = "2026-11-29T00:00:00+07:00";
      else if (s && s.exam.includes("12 Des")) { targetStr = "2026-12-12T00:00:00+07:00"; label = "UO"; }
      const diffDays = Math.ceil((new Date(targetStr) - now) / (1000 * 60 * 60 * 24));
      document.getElementById("countdownBadge").textContent = diffDays > 0 ? `H-${diffDays} ${label}` : (diffDays === 0 ? `Hari-H ${label}!` : `${label} Berjalan`);
    };

    function renderSubjectBar() {
      const bar = document.getElementById("subjectBar");
      const subjBtns = DATA.map((s, i) => `
        <button class="subj-btn ${state.subjectIdx === i ? "active" : ""}" onclick="selectSubject(${i})">
          <span class="s-title">${s.icon} ${s.short}</span>
          <span class="s-meta">${s.code} • ${s.exam}</span>
        </button>
      `).join("");
      const mixedBtn = `
        <button class="subj-btn ${isMixedUTM() ? "active" : ""}" onclick="selectSubject('mixed_utm')">
          <span class="s-title">🎯 Simulasi UTM</span>
          <span class="s-meta">Campur 4 Matkul</span>
        </button>
      `;
      bar.innerHTML = subjBtns + mixedBtn;
    }

    function renderOverview() {
      if (isMixedUTM()) {
        document.getElementById("overviewCard").innerHTML = `
          <div class="overview-row">
            <div>
              <div style="font-size:15px;font-weight:800;">🎯 Simulasi Campuran UTM (28–29 Nov)</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px;">Gabungan acak soal dari Big Data, Pancasila, Pengantar AI, dan NoSQL. Cocok untuk uji kesiapan sebelum hari-H!</div>
            </div>
          </div>
        `;
        return;
      }

      const s = currentSubject();
      const totalFC = s.flashcards.length;
      const learnedCount = s.flashcards.filter((_, idx) => state.learned[`${s.id}_${idx}`]).length;
      const qAns = s.quiz.filter((_, idx) => state.quizAnswers[`${s.id}_${idx}`] !== undefined);
      const qCorrect = s.quiz.filter((q, idx) => state.quizAnswers[`${s.id}_${idx}`] === q.ans).length;
      const pct = Math.round(((learnedCount + qAns.length) / (totalFC + s.quiz.length)) * 100);

      const fcReady = learnedCount >= Math.ceil(totalFC * 0.8);
      const quizReady = qCorrect >= Math.ceil(s.quiz.length * 0.8);
      const readDone = !!state.readiness[`${s.id}_read`];
      const formulaDone = !!state.readiness[`${s.id}_formula`];

      document.getElementById("overviewCard").innerHTML = `
        <div class="overview-row">
          <div>
            <div style="font-size:15px;font-weight:800;">${s.icon} ${s.code} — ${s.name}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">${s.note}</div>
          </div>
          <div style="text-align:right;font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;">${pct}%</div>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div style="display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;">
          <span>🃏 Hafal: <b>${learnedCount}/${totalFC}</b></span>
          <span>📝 Kuis: <b>${qCorrect}/${s.quiz.length}</b> benar (${qAns.length} terjawab)</span>
        </div>
        <div class="readiness-row">
          <button class="check-chip ${readDone ? "done" : ""}" onclick="toggleReadiness('${s.id}_read')">${readDone ? "✓" : "○"} Ringkasan</button>
          <button class="check-chip ${formulaDone ? "done" : ""}" onclick="toggleReadiness('${s.id}_formula')">${formulaDone ? "✓" : "○"} Cheat Sheet</button>
          <span class="check-chip ${fcReady ? "done" : ""}">${fcReady ? "✓" : "○"} Kartu ≥80%</span>
          <span class="check-chip ${quizReady ? "done" : ""}">${quizReady ? "✓" : "○"} Kuis ≥80%</span>
        </div>
      `;
    }

    function renderSummary() {
      if (isMixedUTM()) return `<div class="overview-card" style="text-align:center;">Pilih salah satu mata kuliah di atas untuk membaca ringkasannya, atau langsung buka tab <b>📝 Kuis</b> untuk mulai Simulasi UTM!</div>`;
      const s = currentSubject();
      const q = state.search.trim().toLowerCase();
      const filtered = s.sections.filter(sec => {
        if (!q) return true;
        return (sec.title + " " + (sec.bullets || []).join(" ") + JSON.stringify(sec.table || "")).toLowerCase().includes(q);
      });

      return `
        <input class="search-input" type="search" placeholder="🔍 Cari topik / kata kunci di ${s.short}..." value="${state.search}" oninput="onSearch(this.value)" />
        ${filtered.length === 0 ? `<div class="overview-card" style="text-align:center;color:var(--muted);">Tidak ada topik yang cocok dengan "${state.search}"</div>` : ""}
        ${filtered.map((sec, idx) => `
          <div class="acc-item ${idx === 0 || q ? "open" : ""}" id="acc_${idx}">
            <button class="acc-head" onclick="document.getElementById('acc_${idx}').classList.toggle('open')">
              <span><span class="tag">${sec.tag}</span>${sec.title}</span>
              <span class="acc-chevron">▼</span>
            </button>
            <div class="acc-body">
              ${sec.bullets ? `<ul>${sec.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : ""}
              ${sec.table ? `
                <div class="cheat-table-wrap">
                  <table>
                    <thead><tr>${sec.table.headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
                    <tbody>${sec.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
                  </table>
                </div>
              ` : ""}
            </div>
          </div>
        `).join("")}
      `;
    }

    function renderCheatSheet() {
      if (isMixedUTM()) return `<div class="overview-card" style="text-align:center;">Pilih mata kuliah spesifik di atas untuk melihat Cheat Sheet rumus & istilahnya.</div>`;
      const s = currentSubject();
      return `
        <div class="cheat-grid">
          ${s.cheatsheet.map(box => `
            <div class="cheat-box">
              <h3>⚡ ${box.title}</h3>
              <ul>${box.items.map(it => `<li>${it}</li>`).join("")}</ul>
            </div>
          `).join("")}
        </div>
      `;
    }

    function getDeck() {
      if (isMixedUTM()) return [];
      const s = currentSubject();
      const items = s.flashcards.map((c, idx) => ({ ...c, origIdx: idx }));
      if (state.fcFilter === "unlearned") {
        const res = items.filter(c => !state.learned[`${s.id}_${c.origIdx}`]);
        return res.length ? res : items;
      }
      if (state.fcFilter === "starred") {
        const res = items.filter(c => state.starredFC[`${s.id}_${c.origIdx}`]);
        return res.length ? res : items;
      }
      return items;
    }

    function renderFlashcard() {
      if (isMixedUTM()) return `<div class="overview-card" style="text-align:center;">Pilih mata kuliah spesifik di atas untuk latihan Flashcard.</div>`;
      const s = currentSubject();
      const deck = getDeck();
      if (state.fcIdx >= deck.length) state.fcIdx = 0;
      const card = deck[state.fcIdx];
      const isLearned = !!state.learned[`${s.id}_${card.origIdx}`];
      const isStarred = !!state.starredFC[`${s.id}_${card.origIdx}`];

      return `
        <div class="fc-controls">
          <span style="font-size:12.5px;font-weight:700;color:var(--muted);">Kartu ${state.fcIdx + 1}/${deck.length} ${isLearned ? "• ✅ Paham" : ""}</span>
          <div style="display:flex;gap:6px;">
            <button class="icon-btn ${state.fcFilter === 'all' ? 'active' : ''}" onclick="setFCFilter('all')">Semua</button>
            <button class="icon-btn ${state.fcFilter === 'unlearned' ? 'active' : ''}" onclick="setFCFilter('unlearned')">Belum Hafal</button>
            <button class="icon-btn ${state.fcFilter === 'starred' ? 'active' : ''}" onclick="setFCFilter('starred')">⭐</button>
          </div>
        </div>
        <div class="fc-card ${state.fcFlipped ? "flipped" : ""}" id="fcCardEl" onclick="flipCard()">
          <button class="fc-star ${isStarred ? "marked" : ""}" onclick="event.stopPropagation(); toggleStarFC(${card.origIdx})">${isStarred ? "★ Ditandai" : "☆ Tandai"}</button>
          <div class="fc-label">${state.fcFlipped ? "Jawaban" : "Pertanyaan / Konsep"}</div>
          <div class="fc-text">${state.fcFlipped ? card.a : card.q}</div>
          <div class="fc-hint">${state.fcFlipped ? "Tap untuk balik • Geser kiri/kanan" : "Tap untuk lihat jawaban • Geser kiri/kanan"}</div>
        </div>
        <div class="fc-actions">
          <button class="btn btn-warn" onclick="markCard(${card.origIdx}, false)">↺ Ulangi Nanti</button>
          <button class="btn btn-success" onclick="markCard(${card.origIdx}, true)">✓ Sudah Paham</button>
        </div>
        <div class="quiz-nav">
          <button class="btn" onclick="moveCard(-1)">← Sebelumnya</button>
          <button class="btn btn-primary" onclick="moveCard(1)">Berikutnya →</button>
        </div>
      `;
    }

    function shuffleArr(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildQuizSession() {
      let pool = [];
      if (isMixedUTM()) {
        DATA.slice(0, 4).forEach(s => {
          s.quiz.forEach((q, idx) => pool.push({ subjId: s.id, subjShort: s.short, qIdx: idx, origQ: q }));
        });
        pool = shuffleArr(pool).slice(0, 20);
      } else {
        const s = currentSubject();
        pool = s.quiz.map((q, idx) => ({ subjId: s.id, subjShort: s.short, qIdx: idx, origQ: q }));
      }

      if (state.onlyWrongQuiz) {
        const wrong = pool.filter(item => {
          const ans = state.quizAnswers[`${item.subjId}_${item.qIdx}`];
          return ans !== undefined && ans !== item.origQ.ans;
        });
        if (wrong.length) pool = wrong;
      } else if (state.onlyStarredQuiz) {
        const starred = pool.filter(item => state.starredQ[`${item.subjId}_${item.qIdx}`]);
        if (starred.length) pool = starred;
      }

      if (state.shuffleQuiz && !isMixedUTM()) {
        pool = shuffleArr(pool);
      }

      state.quizSession = pool.map(item => {
        const optsWithFlag = item.origQ.opts.map((text, idx) => ({ text, isAns: idx === item.origQ.ans, origIdx: idx }));
        const finalOpts = (state.shuffleQuiz || isMixedUTM()) ? shuffleArr(optsWithFlag) : optsWithFlag;
        const mappedAns = finalOpts.findIndex(o => o.isAns);
        return { ...item, displayOpts: finalOpts, mappedAns };
      });
      state.quizIdx = 0;
      state.quizFinished = false;
    }

    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function renderQuiz() {
      if (!state.quizSession) buildQuizSession();
      const session = state.quizSession;

      const toolbar = `
        <div class="quiz-toolbar">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="icon-btn ${state.shuffleQuiz ? "active" : ""}" onclick="toggleShuffleQuiz()">🔀 Acak</button>
            <button class="icon-btn ${state.onlyStarredQuiz ? "active" : ""}" onclick="toggleStarredQuiz()">⭐ Ditandai</button>
            <button class="icon-btn ${state.timerActive ? "active" : ""}" onclick="toggleTimer()">⏱️ ${state.timerActive ? formatTimer(state.timerSec) : "Timer"}</button>
          </div>
          <button class="icon-btn" onclick="resetQuiz()">🔄 Reset</button>
        </div>
      `;

      if (state.quizFinished) {
        const correct = session.filter(item => state.quizAnswers[`${item.subjId}_${item.qIdx}`] === item.origQ.ans).length;
        const wrongCount = session.filter(item => {
          const a = state.quizAnswers[`${item.subjId}_${item.qIdx}`];
          return a !== undefined && a !== item.origQ.ans;
        }).length;
        const score = Math.round((correct / session.length) * 100);
        return `
          ${toolbar}
          <div class="quiz-card score-banner">
            <div style="font-size:13px;font-weight:700;color:var(--muted);">Hasil Kuis ${isMixedUTM() ? "Simulasi UTM" : currentSubject().name}</div>
            <div class="score-big">${score}</div>
            <div style="margin:8px 0 16px;font-size:14px;">Benar <b>${correct}</b> dari <b>${session.length}</b> soal</div>
            <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;">
              <button class="btn" onclick="reviewQuiz()">🔍 Pembahasan</button>
              ${wrongCount > 0 ? `<button class="btn btn-warn" onclick="retryWrong()">🎯 Ulangi ${wrongCount} Soal Salah</button>` : ""}
              <button class="btn btn-primary" onclick="resetQuiz()">🔄 Mulai Baru</button>
            </div>
          </div>
        `;
      }

      const item = session[state.quizIdx];
      const key = `${item.subjId}_${item.qIdx}`;
      const userOrigAns = state.quizAnswers[key];
      const answered = userOrigAns !== undefined;
      const isStarred = !!state.starredQ[key];
      const keys = ["A", "B", "C", "D"];

      return `
        ${toolbar}
        <div class="quiz-card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="q-num">SOAL ${state.quizIdx + 1} / ${session.length} ${isMixedUTM() ? `• ${item.subjShort}` : ""}</span>
            <button class="icon-btn ${isStarred ? "active" : ""}" style="font-size:11.5px;padding:4px 9px;" onclick="toggleStarQ('${key}')">${isStarred ? "★ Ditandai" : "☆ Tandai Sulit"}</button>
          </div>
          <div class="q-text">${item.origQ.q}</div>
          <div class="opt-list">
            ${item.displayOpts.map((opt, idx) => {
              let cls = "";
              if (answered) {
                if (opt.isAns) cls = "correct";
                else if (opt.origIdx === userOrigAns) cls = "wrong";
              }
              return `
                <button class="opt-btn ${cls}" ${answered ? "disabled" : ""} onclick="answerQuiz('${key}', ${opt.origIdx})">
                  <span class="opt-key">${keys[idx]}.</span>
                  <span>${opt.text}</span>
                </button>
              `;
            }).join("")}
          </div>
          ${answered ? `
            <div class="explain-box">
              <b>${userOrigAns === item.origQ.ans ? "✅ Benar!" : "❌ Kurang tepat."}</b> ${item.origQ.exp}
            </div>
          ` : ""}
          <div class="quiz-nav">
            <button class="btn" ${state.quizIdx === 0 ? "disabled" : ""} onclick="moveQuiz(-1)">← Sebelumnya</button>
            ${state.quizIdx < session.length - 1
              ? `<button class="btn btn-primary" onclick="moveQuiz(1)">Berikutnya →</button>`
              : `<button class="btn btn-primary" onclick="finishQuiz()">Selesai ✓</button>`
            }
          </div>
        </div>
      `;
    }

    function attachSwipe() {
      const el = document.getElementById("fcCardEl");
      if (!el) return;
      let startX = 0;
      el.addEventListener("touchstart", e => { startX = e.changedTouches[0].screenX; }, { passive: true });
      el.addEventListener("touchend", e => {
        const diff = e.changedTouches[0].screenX - startX;
        if (Math.abs(diff) > 55) moveCard(diff < 0 ? 1 : -1);
      }, { passive: true });
    }

    function render() {
      updateCountdown();
      renderSubjectBar();
      renderOverview();
      document.querySelectorAll(".mode-btn, .bnav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === state.mode);
        btn.onclick = () => {
          state.mode = btn.dataset.mode;
          state.quizFinished = false;
          render();
        };
      });
      const area = document.getElementById("contentArea");
      if (state.mode === "summary") area.innerHTML = renderSummary();
      else if (state.mode === "cheatsheet") area.innerHTML = renderCheatSheet();
      else if (state.mode === "flashcard") { area.innerHTML = renderFlashcard(); attachSwipe(); }
      else area.innerHTML = renderQuiz();
    }

    window.selectSubject = (i) => {
      state.subjectIdx = i;
      state.fcIdx = 0;
      state.fcFlipped = false;
      state.quizSession = null;
      state.onlyWrongQuiz = false;
      state.onlyStarredQuiz = false;
      state.quizFinished = false;
      state.search = "";
      if (i === "mixed_utm" && (state.mode === "summary" || state.mode === "cheatsheet" || state.mode === "flashcard")) {
        state.mode = "quiz";
      }
      render();
    };
    window.onSearch = (val) => { state.search = val; render(); };
    window.toggleReadiness = (key) => { state.readiness[key] = !state.readiness[key]; saveState(); renderOverview(); };
    window.flipCard = () => { state.fcFlipped = !state.fcFlipped; render(); };
    window.moveCard = (delta) => {
      const deck = getDeck();
      if (!deck.length) return;
      state.fcIdx = (state.fcIdx + delta + deck.length) % deck.length;
      state.fcFlipped = false;
      render();
    };
    window.markCard = (origIdx, val) => {
      const s = currentSubject();
      if (val) state.learned[`${s.id}_${origIdx}`] = true;
      else delete state.learned[`${s.id}_${origIdx}`];
      saveState();
      moveCard(1);
    };
    window.toggleStarFC = (origIdx) => {
      const s = currentSubject();
      const k = `${s.id}_${origIdx}`;
      if (state.starredFC[k]) delete state.starredFC[k]; else state.starredFC[k] = true;
      saveState();
      render();
    };
    window.setFCFilter = (f) => { state.fcFilter = f; state.fcIdx = 0; state.fcFlipped = false; render(); };
    window.toggleStarQ = (key) => {
      if (state.starredQ[key]) delete state.starredQ[key]; else state.starredQ[key] = true;
      saveState();
      render();
    };
    window.answerQuiz = (key, origOptIdx) => { state.quizAnswers[key] = origOptIdx; saveState(); render(); };
    window.moveQuiz = (delta) => {
      state.quizIdx = Math.max(0, Math.min(state.quizSession.length - 1, state.quizIdx + delta));
      render();
    };
    window.finishQuiz = () => { state.quizFinished = true; if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; state.timerActive = false; } render(); };
    window.reviewQuiz = () => { state.quizFinished = false; state.quizIdx = 0; render(); };
    window.toggleShuffleQuiz = () => { state.shuffleQuiz = !state.shuffleQuiz; buildQuizSession(); render(); };
    window.toggleStarredQuiz = () => { state.onlyStarredQuiz = !state.onlyStarredQuiz; state.onlyWrongQuiz = false; buildQuizSession(); render(); };
    window.retryWrong = () => {
      const wrongItems = state.quizSession.filter(item => {
        const k = `${item.subjId}_${item.qIdx}`;
        return state.quizAnswers[k] !== undefined && state.quizAnswers[k] !== item.origQ.ans;
      });
      if (!wrongItems.length) return;
      wrongItems.forEach(item => {
        delete state.quizAnswers[`${item.subjId}_${item.qIdx}`];
      });
      saveState();
      state.quizSession = wrongItems;
      state.quizIdx = 0;
      state.quizFinished = false;
      render();
    };
    window.resetQuiz = () => {
      if (state.quizSession) {
        state.quizSession.forEach(item => delete state.quizAnswers[`${item.subjId}_${item.qIdx}`]);
      }
      saveState();
      state.onlyWrongQuiz = false;
      buildQuizSession();
      render();
    };
    window.toggleTimer = () => {
      if (state.timerActive) {
        clearInterval(state.timerHandle);
        state.timerHandle = null;
        state.timerActive = false;
        render();
      } else {
        state.timerActive = true;
        state.timerSec = (state.quizSession ? state.quizSession.length : 20) * 60;
        state.timerHandle = setInterval(() => {
          state.timerSec--;
          if (state.timerSec <= 0) {
            clearInterval(state.timerHandle);
            state.timerHandle = null;
            state.timerActive = false;
            state.quizFinished = true;
          }
          render();
        }, 1000);
        render();
      }
    };

    initTheme();
    render();
  </script>
</body>
</html>
