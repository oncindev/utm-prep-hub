<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTM Prep Hub — Sains Data UT Bandung (Sem 3)</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #1e293b;
      --card: #1e293b;
      --card-2: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-bg: rgba(56, 189, 248, 0.14);
      --accent: #a78bfa;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    html.light {
      --bg: #f8fafc;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-bg: rgba(2, 132, 199, 0.1);
      --accent: #7c3aed;
      --success: #059669;
      --success-bg: rgba(5, 150, 105, 0.1);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.1);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      font-size: 15px;
      padding-bottom: 72px;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 10px;
      backdrop-filter: blur(10px);
    }
    .header-top {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--warning-bg);
      color: var(--warning);
      white-space: nowrap;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .subject-bar {
      max-width: 900px;
      margin: 10px auto 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .subject-bar::-webkit-scrollbar { display: none; }
    .subj-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .subj-btn.active {
      border-color: var(--primary);
      background: var(--primary-bg);
      color: var(--text);
    }
    .subj-btn .s-title {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }
    .subj-btn .s-meta {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }
    .subj-btn.active .s-meta { color: var(--primary); }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px;
    }
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      background: var(--card);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #082f49;
    }
    html.light .mode-btn.active { color: #ffffff; }

    .overview-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .overview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: var(--card-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.25s ease;
    }

    /* Accordion */
    .acc-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .acc-head {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }
    .acc-body {
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
      display: none;
      font-size: 14px;
    }
    .acc-item.open .acc-body { display: block; }
    .acc-item.open .acc-chevron { transform: rotate(180deg); }
    .acc-chevron { transition: transform 0.2s ease; color: var(--muted); }
    .acc-body ul { padding-left: 18px; margin: 10px 0 0; }
    .acc-body li { margin-bottom: 6px; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-bg);
      color: var(--primary);
      margin-right: 6px;
    }
    .cheat-table-wrap {
      overflow-x: auto;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--card-2); font-weight: 700; }

    /* Flashcard */
    .fc-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .fc-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      min-height: 220px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.12s ease;
      user-select: none;
    }
    .fc-card:active { transform: scale(0.99); }
    .fc-card.flipped { border-color: var(--primary); background: var(--card-2); }
    .fc-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .fc-text { font-size: 17px; font-weight: 600; max-width: 620px; }
    .fc-card.flipped .fc-text { font-size: 15px; font-weight: 500; }
    .fc-hint { font-size: 12px; color: var(--muted); margin-top: 14px; }
    .fc-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #082f49; border-color: transparent; }
    html.light .btn-primary { color: #ffffff; }
    .btn-success { background: var(--success-bg); color: var(--success); border-color: var(--success); }
    .btn-warn { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }

    /* Quiz */
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .q-num { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .q-text { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
    .opt-list { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .opt-btn.correct { background: var(--success-bg); border-color: var(--success); color: var(--text); }
    .opt-btn.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--text); }
    .opt-key {
      font-weight: 800;
      min-width: 22px;
      color: var(--primary);
    }
    .explain-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--primary-bg);
      border-left: 4px solid var(--primary);
      font-size: 13.5px;
    }
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .score-banner {
      text-align: center;
      padding: 20px 14px;
    }
    .score-big {
      font-size: 40px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <h1>UT Prep Hub — Sains Data</h1>
        <p>UT Bandung • Sem 3 Lengkap (UTM &amp; UO)</p>
      </div>
      <div class="header-actions">
        <span class="pill-badge" id="countdownBadge">H-3 UTM</span>
        <button class="icon-btn" id="themeBtn" title="Ganti Tema">☀️ / 🌙</button>
      </div>
    </div>
    <nav class="subject-bar" id="subjectBar"></nav>
  </header>

  <main class="container">
    <section class="overview-card" id="overviewCard"></section>

    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="summary">📖 Ringkasan</button>
      <button class="mode-btn" data-mode="flashcard">🃏 Flashcard</button>
      <button class="mode-btn" data-mode="quiz">📝 Kuis UTM</button>
    </div>

    <div id="contentArea"></div>
  </main>

  <script>
    const DATA = [
      {
        id: "bigdata",
        code: "STDA4202",
        short: "Big Data",
        name: "Analitik Big Data",
        exam: "UTM 28 Nov",
        icon: "📊",
        note: "Study Guide (BMP Sementara) • Fokus: 5V, Arsitektur, Hadoop/Spark, Clustering, Forecasting, Classification, Medsos.",
        sections: [
          {
            title: "1. Konsep Dasar Big Data (5V & Jenis Data)",
            tag: "Wajib Hafal",
            bullets: [
              "<b>5V Big Data</b>: <b>Volume</b> (ukuran sangat besar), <b>Velocity</b> (kecepatan aliran/real-time), <b>Variety</b> (keragaman format), <b>Veracity</b> (akurasi & keandalan data), <b>Value</b> (nilai bisnis yang diekstrak).",
              "<b>Jenis Data</b>: Terstruktur (RDBMS/tabel), Semiterstruktur (JSON, XML), Tidak terstruktur (teks bebas, gambar, video).",
              "<b>4 Tipe Analytics</b>: <i>Descriptive</i> (apa yg terjadi), <i>Diagnostic</i> (mengapa terjadi), <i>Predictive</i> (apa yg akan terjadi), <i>Prescriptive</i> (rekomendasi tindakan)."
            ]
          },
          {
            title: "2. Lifecycle & Arsitektur Big Data",
            tag: "Konsep Inti",
            bullets: [
              "<b>Lifecycle</b>: Collection → Storage (Data Lake/Warehouse) → Processing (Batch/Real-time) → Analysis → Visualization → Decision Making.",
              "<b>Arsitektur Layer</b>: Sumber Data → <i>Ingestion Layer</i> (Apache Kafka, Flume) → <i>Storage Layer</i> (HDFS / Data Lake vs Amazon Redshift / Data Warehouse) → <i>Processing Layer</i> (Hadoop / Spark) → <i>Analytics Layer</i> (ML/Statistik) → <i>Visualization</i> (Tableau, Power BI)."
            ]
          },
          {
            title: "3. Hadoop Ecosystem & Apache Spark",
            tag: "Teknologi",
            bullets: [
              "<b>Hadoop</b>: <b>HDFS</b> (penyimpanan terdistribusi berbasis blok + replikasi fault-tolerant), <b>MapReduce</b> (tahap <i>Map</i>: ubah ke key-value; tahap <i>Reduce</i>: agregasi/gabung hasil), <b>YARN</b> (manajer sumber daya klaster).",
              "<b>Ekosistem Hadoop</b>: <b>Hive</b> (query SQL-like), <b>Pig</b> (pemrograman data flow), <b>HBase</b> (NoSQL), <b>Spark</b> (pemrosesan <i>in-memory</i> super cepat).",
              "<b>Arsitektur Spark</b>: <b>Driver</b> (mengelola eksekusi & membangun <b>DAG</b>) + <b>Cluster Manager</b> (YARN/Mesos/Kubernetes).",
              "<b>RDD (Resilient Distributed Dataset)</b>: struktur data dasar Spark yang <i>immutable</i> & terpartisi. Operasi: <b>Transformations</b> (lazy, bikin RDD baru: <code>map</code>, <code>filter</code>, <code>reduceByKey</code>) vs <b>Actions</b> (eksekusi & kembalikan nilai: <code>count</code>, <code>collect</code>, <code>saveAsTextFile</code>).",
              "<b>Modul Spark</b>: Spark SQL, Spark Streaming, <b>MLlib</b> (machine learning), <b>GraphX</b> (analisis graf)."
            ]
          },
          {
            title: "4. Metode Lanjut: Clustering, Forecasting, Classification",
            tag: "Algoritma",
            table: {
              headers: ["Metode", "Tipe & Tujuan", "Algoritma Utama", "Metrik Evaluasi"],
              rows: [
                ["<b>Clustering</b>", "Unsupervised; kelompokkan data mirip tanpa label", "K-Means (Hard), GMM (Soft), Hierarchical (Agglomerative/Divisive), DBSCAN (density + deteksi noise), Mean Shift", "Silhouette Score, Davies-Bouldin Index"],
                ["<b>Forecasting</b>", "Prediksi nilai masa depan dari data historis", "Time Series (Trend, Musiman, Siklus, Noise): ARIMA, Exponential Smoothing; Causal: Regresi Linier; Kualitatif: Delphi", "MAE, MSE, RMSE"],
                ["<b>Classification</b>", "Supervised; prediksi kelas/kategori berlabel (Binary, Multiclass, Multilabel)", "Logistic Regression, Decision Tree, Random Forest (ensemble), SVM (hyperplane + kernel trick), KNN, Neural Networks", "Accuracy, Precision, Recall, F1-Score"]
              ]
            }
          },
          {
            title: "5. Big Data untuk Media Sosial",
            tag: "Aplikasi",
            bullets: [
              "<b>Manfaat</b>: Analisis sentimen (NLP), segmentasi pengguna, pemasaran terpersonalisasi, pemantauan tren, deteksi anomali (hoax/penipuan).",
              "<b>Tantangan</b>: Volume real-time tinggi, keberagaman format (teks/gambar/video), kualitas data, serta <b>privasi & keamanan</b> (kepatuhan GDPR, CCPA)."
            ]
          }
        ],
        flashcards: [
          { q: "Apa saja 5V karakteristik Big Data?", a: "Volume (jumlah besar), Velocity (kecepatan real-time), Variety (ragam format), Veracity (akurasi/keandalan), Value (nilai yang diekstrak)." },
          { q: "Bedanya Predictive vs Prescriptive Analytics?", a: "Predictive memprediksi apa yang mungkin terjadi di masa depan; Prescriptive memberi rekomendasi tindakan yang harus diambil." },
          { q: "Apa fungsi YARN pada Hadoop?", a: "Yet Another Resource Negotiator: mengelola dan mengalokasikan sumber daya klaster agar berbagai aplikasi (bukan hanya MapReduce) bisa berjalan di atas Hadoop." },
          { q: "Apa beda Transformations dan Actions pada Spark RDD?", a: "Transformations menghasilkan RDD baru (misal map, filter, reduceByKey); Actions mengembalikan nilai ke Driver atau menyimpan hasil (misal count, collect)." },
          { q: "Apa keunggulan utama DBSCAN dibanding K-Means?", a: "DBSCAN berbasis kepadatan (density), bisa menemukan klaster berbentuk arbitrer, tidak perlu tentukan K di awal, dan mampu mengidentifikasi noise/outlier." },
          { q: "Sebutkan 4 komponen Time Series dalam Forecasting!", a: "Trend (jangka panjang), Musiman (berulang teratur), Siklus (berulang tidak teratur/ekonomi), dan Noise (fluktuasi acak)." },
          { q: "Mengapa Random Forest lebih baik dari Decision Tree tunggal?", a: "Random Forest menggabungkan banyak Decision Tree (ensemble learning) sehingga akurasi lebih tinggi dan mengurangi risiko overfitting." },
          { q: "Apa fungsi modul GraphX dan MLlib di Apache Spark?", a: "MLlib untuk algoritma Machine Learning; GraphX untuk pemrosesan dan analisis data graf (seperti jejaring sosial)." }
        ],
        quiz: [
          {
            q: "Karakteristik Big Data yang berkaitan dengan tingkat akurasi, keandalan, dan kebersihan data disebut...",
            opts: ["Volume", "Velocity", "Veracity", "Value"],
            ans: 2,
            exp: "Veracity mengacu pada tingkat akurasi dan keandalan data (apakah data dapat dipercaya/bebas noise)."
          },
          {
            q: "Sebuah perusahaan e-commerce ingin mengetahui alasan mengapa penjualan turun drastis bulan lalu. Jenis analitik yang tepat adalah...",
            opts: ["Descriptive Analytics", "Diagnostic Analytics", "Predictive Analytics", "Prescriptive Analytics"],
            ans: 1,
            exp: "Diagnostic analytics bertujuan mencari tahu MENGAPA sesuatu terjadi dengan menganalisis data historis yang relevan."
          },
          {
            q: "Pada arsitektur Big Data, Apache Kafka dan Apache Flume umumnya berperan di layer...",
            opts: ["Data Ingestion Layer", "Data Storage Layer", "Data Visualization Layer", "Data Analytics Layer"],
            ans: 0,
            exp: "Kafka dan Flume adalah tools pada Data Ingestion Layer untuk mengumpulkan/mengalirkan data dari berbagai sumber."
          },
          {
            q: "Pada model pemrograman MapReduce, tahap yang bertugas mengubah data input menjadi pasangan key-value adalah...",
            opts: ["Reduce", "Shuffle", "Map", "Split"],
            ans: 2,
            exp: "Tahap Map membaca data dan memprosesnya menjadi pasangan kunci-nilai (key-value), lalu tahap Reduce menggabungkannya."
          },
          {
            q: "Mengapa Apache Spark jauh lebih cepat dibanding Hadoop MapReduce tradisional?",
            opts: ["Karena hanya berjalan di satu komputer", "Karena melakukan pemrosesan data di memori (in-memory)", "Karena tidak menggunakan klaster", "Karena hanya mendukung SQL"],
            ans: 1,
            exp: "Spark melakukan in-memory processing sehingga menghindari overhead I/O disk berulang seperti pada MapReduce."
          },
          {
            q: "Manakah yang termasuk operasi Action pada Spark RDD?",
            opts: ["map()", "filter()", "reduceByKey()", "collect()"],
            ans: 3,
            exp: "collect(), count(), dan saveAsTextFile() adalah Actions; sedangkan map(), filter(), dan reduceByKey() adalah Transformations."
          },
          {
            q: "Algoritma clustering yang bersifat 'soft clustering' (satu data bisa masuk lebih dari satu klaster dengan probabilitas) adalah...",
            opts: ["K-Means", "Gaussian Mixture Models (GMM)", "DBSCAN", "Agglomerative Hierarchical"],
            ans: 1,
            exp: "GMM adalah model probabilistik (soft clustering), sedangkan K-Means adalah hard clustering."
          },
          {
            q: "Dalam forecasting, metode kualitatif yang mengandalkan konsensus pendapat para ahli saat data historis tidak tersedia adalah...",
            opts: ["ARIMA", "Exponential Smoothing", "Metode Delphi", "Regresi Linier"],
            ans: 2,
            exp: "Metode Delphi dan focus group termasuk qualitative forecasting untuk kondisi minim data historis."
          },
          {
            q: "Metrik evaluasi yang tepat untuk menilai kualitas model Regression/Forecasting adalah...",
            opts: ["Silhouette Score & Davies-Bouldin", "Precision & Recall", "MAE, MSE, dan RMSE", "F1-Score & ROC"],
            ans: 2,
            exp: "MAE, MSE, dan RMSE mengukur error prediksi numerik pada forecasting/regresi. Silhouette untuk clustering; Precision/Recall/F1 untuk classification."
          },
          {
            q: "Ketika model klasifikasi sangat akurat pada data training tetapi buruk pada data testing, kondisi ini disebut...",
            opts: ["Underfitting", "Overfitting", "Imbalanced Classes", "Kernel Trick"],
            ans: 1,
            exp: "Overfitting terjadi saat model terlalu kompleks menghafal data latih sehingga gagal melakukan generalisasi pada data baru."
          }
        ]
      },
      {
        id: "pancasila",
        code: "MKWN4110",
        short: "Pancasila",
        name: "Pendidikan Pancasila",
        exam: "UTM 28 Nov",
        icon: "🇮🇩",
        note: "Modul 1–6 Lengkap • Fokus: Sejarah BPUPK/PPKI, Dasar Falsafah, Ideologi Negara, Sistem Filsafat, Paradigma IPTEK.",
        sections: [
          {
            title: "Modul 1: Pengantar Pendidikan Pancasila",
            tag: "Dasar",

              "<b>Transformasi Variabel Random</b>: Jika <code>Y = g(X)</code> monoton, metode CDF: <code>F<sub>Y</sub>(y) = P(g(X) ≤ y)</code>; metode Jacobian: <code>f<sub>Y</sub>(y) = f<sub>X</sub>(g<sup>−1</sup>(y)) · |dx/dy|</code>.",
              "<b>Konvergensi & Hukum Bilangan Besar</b>: Rata-rata sampel <code>X̄<sub>n</sub></code> konvergen dalam probabilitas ke μ (didukung Ketaksamaan Chebyshev).",
              "<b>Teorema Limit Pusat (CLT)</b>: Untuk sampel acak berukuran <i>n</i> besar dengan mean μ dan variansi σ<sup>2</sup>, distribusi dari <code>Z<sub>n</sub> = (X̄<sub>n</sub> − μ) / (σ/√n)</code> mendekati <b>Normal Standar N(0, 1)</b>."
            ]
          }
        ],
        flashcards: [
          { q: "Apa syarat dua kejadian A dan B disebut independen?", a: "P(A ∩ B) = P(A) · P(B), atau setara dengan P(A|B) = P(A) jika P(B) > 0." },
          { q: "Bagaimana rumus praktis menghitung Variansi Var(X)?", a: "Var(X) = E[X²] − (E[X])², dan sifat skalanya: Var(aX + b) = a² · Var(X)." },
          { q: "Bagaimana cara mencari distribusi marginal f_X(x) dari distribusi bersama f(x,y)?", a: "Jumlahkan (diskrit) atau integralkan (kontinu) f(x,y) terhadap semua nilai y." },
          { q: "Apa definisi Fungsi Pembangkit Momen (MGF) dan kegunaannya?", a: "M_X(t) = E[e^(tX)]. Turunan ke-k di t=0 menghasilkan momen ke-k: E[X^k] = M_X^(k)(0), dan MGF menentukan distribusi secara unik." },
          { q: "Distribusi kontinu apa yang memiliki sifat 'memoryless' (tanpa ingatan)?", a: "Distribusi Eksponensial: P(X > a + t | X > a) = P(X > t)." },
          { q: "Apa perbedaan utama distribusi Binomial dan Hipergeometrik?", a: "Binomial untuk pengambilan DENGAN pengembalian (probabilitas p tetap), sedangkan Hipergeometrik untuk pengambilan TANPA pengembalian." },
          { q: "Apa rumus transformasi densitas (metode Jacobian) untuk Y = g(X) monoton?", a: "f_Y(y) = f_X(g⁻¹(y)) · |dx/dy|." },
          { q: "Apa inti dari Teorema Limit Pusat (Central Limit Theorem)?", a: "Untuk ukuran sampel n yang cukup besar, distribusi rata-rata sampel (atau jumlah sampel) yang distandardisasi akan mendekati Normal Standar N(0, 1)." }
        ],
        quiz: [
          {
            q: "Dari 5 orang calon, akan dipilih 3 orang untuk menduduki jabatan Ketua, Sekretaris, dan Bendahara. Banyaknya susunan pengurus yang mungkin adalah...",
            opts: ["10", "15", "60", "125"],
            ans: 2,
            exp: "Karena jabatan berbeda (urutan penting), gunakan Permutasi P(5,3) = 5! / (5-3)! = 5 × 4 × 3 = 60."
          },
          {
            q: "Jika A dan B adalah dua kejadian independen dengan P(A) = 0,4 dan P(B) = 0,5, maka nilai P(A ∪ B) adalah...",
            opts: ["0,20", "0,70", "0,90", "0,10"],
            ans: 1,
            exp: "Independen → P(A∩B) = 0,4 × 0,5 = 0,20. Maka P(A∪B) = P(A) + P(B) − P(A∩B) = 0,4 + 0,5 − 0,2 = 0,70."
          },
          {
            q: "Diketahui variabel random X mempunyai E[X] = 5 dan E[X²] = 29. Nilai dari Var(2X − 3) adalah...",
            opts: ["4", "8", "16", "13"],
            ans: 2,
            exp: "Var(X) = E[X²] − (E[X])² = 29 − 25 = 4. Lalu Var(2X − 3) = 2² · Var(X) = 4 × 4 = 16."
          },
          {
            q: "Suatu fungsi distribusi kumulatif (CDF) F(x) dari variabel random kontinu X memenuhi hubungan dengan fungsi densitas f(x) yaitu...",
            opts: ["f(x) = ∫ F(x) dx", "f(x) = F'(x)", "F(x) = f'(x)", "F(x) = 1 − f(x)"],
            ans: 1,
            exp: "Untuk variabel random kontinu, fungsi densitas f(x) adalah turunan pertama dari CDF F(x), yaitu f(x) = dF(x)/dx."
          },
          {
            q: "Variabel random X dan Y dikatakan independen secara statistik jika fungsi densitas bersamanya memenuhi...",
            opts: ["f(x,y) = f_X(x) + f_Y(y)", "f(x,y) = f_X(x) · f_Y(y)", "Cov(X,Y) = 1", "E[X+Y] = E[X] + E[Y]"],
            ans: 1,
            exp: "Syarat perlu dan cukup independensi dua variabel random adalah f(x,y) = f_X(x) · f_Y(y) untuk setiap (x,y)."
          },
          {
            q: "Jika diketahui MGF dari variabel random X adalah M_X(t) = e^(3t + 2t²), maka nilai E[X] adalah...",
            opts: ["2", "3", "4", "6"],
            ans: 1,
            exp: "E[X] = M'_X(0). Turunan pertama M'_X(t) = (3 + 4t)·e^(3t + 2t²). Saat t = 0, hasilnya adalah 3."
          },
          {
            q: "Distribusi diskrit yang memiliki nilai rata-rata (mean) dan variansi yang sama besar, yaitu E[X] = Var(X) = λ, adalah...",
            opts: ["Binomial", "Geometrik", "Poisson", "Hipergeometrik"],
            ans: 2,
            exp: "Pada distribusi Poisson(λ), baik nilai harapan maupun variansinya bernilai sama yaitu λ."
          },
          {
            q: "Sifat 'memoryless' P(X > a + t | X > a) = P(X > t) pada variabel random kontinu dimiliki oleh distribusi...",
            opts: ["Normal", "Beta", "Eksponensial", "Uniform"],
            ans: 2,
            exp: "Teorema 6.2 menyatakan variabel random kontinu X berdistribusi Eksponensial bila dan hanya bila memenuhi sifat memoryless."
          },
          {
            q: "Misalkan X ~ Uniform(0, 1) dengan f(x) = 1 untuk 0 < x < 1, dan Y = 2X + 1. Fungsi densitas dari Y untuk 1 < y < 3 adalah...",
            opts: ["h(y) = 2", "h(y) = 1/2", "h(y) = 1", "h(y) = y/2"],
            ans: 1,
            exp: "Invers x = (y−1)/2, sehingga |dx/dy| = 1/2. Dengan metode Jacobian: h(y) = f(x)·|dx/dy| = 1 · (1/2) = 1/2."
          },
          {
            q: "Berdasarkan Teorema Limit Pusat (Central Limit Theorem), jika diambil sampel acak berukuran besar (n → ∞) dari populasi berdistribusi apa pun dengan mean μ dan variansi σ² berhingga, maka distribusi (X̄ − μ)/(σ/√n) mendekati...",
            opts: ["Distribusi Poisson(1)", "Distribusi Eksponensial(1)", "Distribusi Normal Standar N(0, 1)", "Distribusi Uniform(0, 1)"],
            ans: 2,
            exp: "Teorema Limit Pusat menjamin rata-rata sampel yang distandardisasi konvergen dalam distribusi ke Normal Standar N(0,1)."
          }
        ]
      }
    ];

    // State
    let state = {
      subjectIdx: 0,
      mode: "summary",
      search: "",
      fcIdx: 0,
      fcFlipped: false,
      fcOnlyUnlearned: false,
      learned: JSON.parse(localStorage.getItem("ut_learned") || "{}"),
      quizAnswers: JSON.parse(localStorage.getItem("ut_quiz") || "{}"),
      quizIdx: 0,
      quizFinished: false
    };

    const saveState = () => {
      localStorage.setItem("ut_learned", JSON.stringify(state.learned));
      localStorage.setItem("ut_quiz", JSON.stringify(state.quizAnswers));
    };

    // Theme
    const initTheme = () => {
      const saved = localStorage.getItem("ut_theme");
      if (saved === "light") document.documentElement.classList.add("light");
      document.getElementById("themeBtn").onclick = () => {
        document.documentElement.classList.toggle("light");
        localStorage.setItem("ut_theme", document.documentElement.classList.contains("light") ? "light" : "dark");
      };
    };

    // Countdown
    const updateCountdown = () => {
      const s = currentSubject();
      const now = new Date();
      let targetStr = "2026-11-28T00:00:00+07:00";
      let label = "UTM";
      if (s.exam.includes("29 Nov")) { targetStr = "2026-11-29T00:00:00+07:00"; label = "UTM"; }
      else if (s.exam.includes("12 Des")) { targetStr = "2026-12-12T00:00:00+07:00"; label = "UO"; }
      const diffDays = Math.ceil((new Date(targetStr) - now) / (1000 * 60 * 60 * 24));
      const badge = document.getElementById("countdownBadge");
      badge.textContent = diffDays > 0 ? `H-${diffDays} ${label}` : (diffDays === 0 ? `Hari-H ${label}!` : `${label} Berjalan`);
    };

    const currentSubject = () => DATA[state.subjectIdx];

    function renderSubjectBar() {
      const bar = document.getElementById("subjectBar");
      bar.innerHTML = DATA.map((s, i) => `
        <button class="subj-btn ${i === state.subjectIdx ? "active" : ""}" onclick="selectSubject(${i})">
          <span class="s-title">${s.icon} ${s.short}</span>
          <span class="s-meta">${s.code} • ${s.exam}</span>
        </button>
      `).join("");
    }

    function renderOverview() {
      const s = currentSubject();
      const totalFC = s.flashcards.length;
      const learnedCount = s.flashcards.filter((_, idx) => state.learned[`${s.id}_${idx}`]).length;
      const qAns = s.quiz.filter((_, idx) => state.quizAnswers[`${s.id}_${idx}`] !== undefined);
      const qCorrect = s.quiz.filter((q, idx) => state.quizAnswers[`${s.id}_${idx}`] === q.ans).length;
      const pct = Math.round(((learnedCount + qAns.length) / (totalFC + s.quiz.length)) * 100);

      document.getElementById("overviewCard").innerHTML = `
        <div class="overview-row">
          <div>
            <div style="font-size:15px;font-weight:800;">${s.icon} ${s.code} — ${s.name}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;">${s.note}</div>
          </div>
          <div style="text-align:right;font-size:12px;font-weight:700;color:var(--primary);">
            Progres: ${pct}%
          </div>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;">
          <span>🃏 Hafal: <b>${learnedCount}/${totalFC}</b></span>
          <span>📝 Kuis: <b>${qCorrect}/${s.quiz.length}</b> benar (${qAns.length} terjawab)</span>
        </div>
      `;
    }

    function renderSummary() {
      const s = currentSubject();
      const q = state.search.trim().toLowerCase();
      const filtered = s.sections.filter(sec => {
        if (!q) return true;
        const text = (sec.title + " " + (sec.bullets || []).join(" ") + JSON.stringify(sec.table || "")).toLowerCase();
        return text.includes(q);
      });

      return `
        <input class="search-input" type="search" placeholder="🔍 Cari topik / kata kunci di ${s.short}..." value="${state.search}" oninput="onSearch(this.value)" />
        ${filtered.length === 0 ? `<div class="overview-card" style="text-align:center;color:var(--muted);">Tidak ada topik yang cocok dengan "${state.search}"</div>` : ""}
        ${filtered.map((sec, idx) => `
          <div class="acc-item ${idx === 0 || q ? "open" : ""}" id="acc_${idx}">
            <button class="acc-head" onclick="document.getElementById('acc_${idx}').classList.toggle('open')">
              <span><span class="tag">${sec.tag}</span>${sec.title}</span>
              <span class="acc-chevron">▼</span>
            </button>
            <div class="acc-body">
              ${sec.bullets ? `<ul>${sec.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : ""}
              ${sec.table ? `
                <div class="cheat-table-wrap">
                  <table>
                    <thead><tr>${sec.table.headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
                    <tbody>${sec.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
                  </table>
                </div>
              ` : ""}
            </div>
          </div>
        `).join("")}
      `;
    }

    function getDeck() {
      const s = currentSubject();
      const items = s.flashcards.map((c, idx) => ({ ...c, origIdx: idx }));
      if (!state.fcOnlyUnlearned) return items;
      const unlearned = items.filter(c => !state.learned[`${s.id}_${c.origIdx}`]);
      return unlearned.length ? unlearned : items;
    }

    function renderFlashcard() {
      const s = currentSubject();
      const deck = getDeck();
      if (state.fcIdx >= deck.length) state.fcIdx = 0;
      const card = deck[state.fcIdx];
      const isLearned = !!state.learned[`${s.id}_${card.origIdx}`];

      return `
        <div class="fc-controls">
          <span style="font-size:13px;font-weight:700;color:var(--muted);">Kartu ${state.fcIdx + 1} dari ${deck.length} ${isLearned ? "• ✅ Sudah Paham" : ""}</span>
          <button class="icon-btn" onclick="toggleUnlearned()">
            ${state.fcOnlyUnlearned ? "Tampilkan Semua" : "Filter Belum Hafal"}
          </button>
        </div>
        <div class="fc-card ${state.fcFlipped ? "flipped" : ""}" onclick="flipCard()">
          <div class="fc-label">${state.fcFlipped ? "Jawaban" : "Pertanyaan / Konsep"}</div>
          <div class="fc-text">${state.fcFlipped ? card.a : card.q}</div>
          <div class="fc-hint">${state.fcFlipped ? "Tap untuk balik ke pertanyaan" : "Tap kartu untuk lihat jawaban"}</div>
        </div>
        <div class="fc-actions">
          <button class="btn btn-warn" onclick="markCard(${card.origIdx}, false)">↺ Ulangi Nanti</button>
          <button class="btn btn-success" onclick="markCard(${card.origIdx}, true)">✓ Sudah Paham</button>
        </div>
        <div class="quiz-nav">
          <button class="btn" onclick="moveCard(-1)">← Sebelumnya</button>
          <button class="btn btn-primary" onclick="moveCard(1)">Berikutnya →</button>
        </div>
      `;
    }

    function renderQuiz() {
      const s = currentSubject();
      if (state.quizFinished) {
        const correct = s.quiz.filter((q, i) => state.quizAnswers[`${s.id}_${i}`] === q.ans).length;
        const score = Math.round((correct / s.quiz.length) * 100);
        return `
          <div class="quiz-card score-banner">
            <div style="font-size:13px;font-weight:700;color:var(--muted);">Hasil Kuis ${s.name}</div>
            <div class="score-big">${score}</div>
            <div style="margin:8px 0 16px;font-size:14px;">Benar <b>${correct}</b> dari <b>${s.quiz.length}</b> soal</div>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
              <button class="btn" onclick="reviewQuiz()">🔍 Lihat Pembahasan</button>
              <button class="btn btn-primary" onclick="resetQuiz()">🔄 Ulangi Kuis</button>
            </div>
          </div>
        `;
      }

      const q = s.quiz[state.quizIdx];
      const userAns = state.quizAnswers[`${s.id}_${state.quizIdx}`];
      const answered = userAns !== undefined;
      const keys = ["A", "B", "C", "D"];

      return `
        <div class="quiz-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span class="q-num">SOAL ${state.quizIdx + 1} / ${s.quiz.length}</span>
            <button class="icon-btn" style="font-size:11px;padding:4px 8px;" onclick="resetQuiz()">Reset Skor</button>
          </div>
          <div class="q-text">${q.q}</div>
          <div class="opt-list">
            ${q.opts.map((opt, idx) => {
              let cls = "";
              if (answered) {
                if (idx === q.ans) cls = "correct";
                else if (idx === userAns) cls = "wrong";
              }
              return `
                <button class="opt-btn ${cls}" ${answered ? "disabled" : ""} onclick="answerQuiz(${idx})">
                  <span class="opt-key">${keys[idx]}.</span>
                  <span>${opt}</span>
                </button>
              `;
            }).join("")}
          </div>
          ${answered ? `
            <div class="explain-box">
              <b>${userAns === q.ans ? "✅ Benar!" : "❌ Kurang tepat."}</b> ${q.exp}
            </div>
          ` : ""}
          <div class="quiz-nav">
            <button class="btn" ${state.quizIdx === 0 ? "disabled" : ""} onclick="moveQuiz(-1)">← Soal Sebelumnya</button>
            ${state.quizIdx < s.quiz.length - 1
              ? `<button class="btn btn-primary" onclick="moveQuiz(1)">Soal Berikutnya →</button>`
              : `<button class="btn btn-primary" onclick="finishQuiz()">Selesai & Lihat Skor ✓</button>`
            }
          </div>
        </div>
      `;
    }

    function render() {
      updateCountdown();
      renderSubjectBar();
      renderOverview();
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === state.mode);
        btn.onclick = () => { state.mode = btn.dataset.mode; state.quizFinished = false; render(); };
      });
      const area = document.getElementById("contentArea");
      if (state.mode === "summary") area.innerHTML = renderSummary();
      else if (state.mode === "flashcard") area.innerHTML = renderFlashcard();
      else area.innerHTML = renderQuiz();
    }

    window.selectSubject = (i) => {
      state.subjectIdx = i;
      state.fcIdx = 0;
      state.fcFlipped = false;
      state.quizIdx = 0;
      state.quizFinished = false;
      state.search = "";
      render();
    };
    window.onSearch = (val) => { state.search = val; render(); };
    window.flipCard = () => { state.fcFlipped = !state.fcFlipped; render(); };
    window.moveCard = (delta) => {
      const deck = getDeck();
      state.fcIdx = (state.fcIdx + delta + deck.length) % deck.length;
      state.fcFlipped = false;
      render();
    };
    window.markCard = (origIdx, val) => {
      const s = currentSubject();
      if (val) state.learned[`${s.id}_${origIdx}`] = true;
      else delete state.learned[`${s.id}_${origIdx}`];
      saveState();
      moveCard(1);
    };
    window.toggleUnlearned = () => { state.fcOnlyUnlearned = !state.fcOnlyUnlearned; state.fcIdx = 0; state.fcFlipped = false; render(); };
    window.answerQuiz = (optIdx) => {
      const s = currentSubject();
      state.quizAnswers[`${s.id}_${state.quizIdx}`] = optIdx;
      saveState();
      render();
    };
    window.moveQuiz = (delta) => {
      const s = currentSubject();
      state.quizIdx = Math.max(0, Math.min(s.quiz.length - 1, state.quizIdx + delta));
      render();
    };
    window.finishQuiz = () => { state.quizFinished = true; render(); };
    window.reviewQuiz = () => { state.quizFinished = false; state.quizIdx = 0; render(); };
    window.resetQuiz = () => {
      const s = currentSubject();
      s.quiz.forEach((_, i) => delete state.quizAnswers[`${s.id}_${i}`]);
      saveState();
      state.quizFinished = false;
      state.quizIdx = 0;
      render();
    };

    initTheme();
    updateCountdown();
    render();
  </script>
</body>
</html>
